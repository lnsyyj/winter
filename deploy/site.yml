---
# winter · single ansible entry point (ADR-43).
#
# Thin orchestration only: every play is `hosts + roles`. ALL task logic lives in
# roles/<name>/tasks/*.yml; each role's main.yml dispatches on winter_ops_action, and
# multi-host operations attach per-host slices via `include_role tasks_from: <slice>`.
#
# Play-level keywords that roles cannot express (vars_files, serial, when) stay here.
# Any failure stops the run (any_errors_fatal) — partial convergence is not a valid state.
#
# Usage: one inventory (inventory/hosts.ini) + --limit <topology>.
#   ./deploy.sh deploy    --limit multinode -t local-repo
#   ./deploy.sh prechecks --limit pgha -t postgresql
#   ./deploy.sh deploy    --limit pgha -t postgresql-scale-out \
#       -e '{"pg_scale_overrides":{"nodes":["node-b","node-c"]}}'

- name: System checks
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [prechecks]
  roles:
    - role: system-checks
      tags: [prechecks]

- name: System initialization
  hosts: system-init
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [system-init]
  roles:
    - role: system-init
      tags: [system-init]

- name: Base dependencies and OS settings
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [bootstrap]
  roles:
    - role: bootstrap
      when: bootstrap.enabled | default(true) | bool
      tags: [bootstrap]

- name: Internal artifact repository
  hosts: local-repo
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [local-repo]
  roles:
    - role: local-repo
      tags: [local-repo]

- name: PostgreSQL single instance
  hosts: postgresql
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql]
  roles:
    - role: postgresql
      tags: [postgresql]

- name: Nginx access layer
  hosts: nginx
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [nginx]
  roles:
    - role: nginx
      tags: [nginx]

- name: Observability stack
  hosts: observability
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [observability]
  roles:
    - role: observability
      when: observability.enabled | bool
      tags: [observability]

- name: Management Server
  hosts: winter-server
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [winter-server]
  roles:
    - role: winter-server
      when: winter_server.enabled | bool
      tags: [winter-server]

- name: Harbor registry
  hosts: harbor
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [harbor]
  roles:
    - role: harbor
      when: harbor.enabled | bool
      tags: [harbor]

- name: Keepalived Director and LVS real servers
  hosts: keepalived
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [keepalived]
  roles:
    - role: keepalived
      when: ha.enabled | bool
      tags: [keepalived]

- name: BIND 9 DNS
  hosts: named
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [named]
  roles:
    - role: named
      when: dns.enabled | bool
      tags: [named]

- name: Agent pre-install on managed nodes
  hosts: agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [agent]
  roles:
    - role: agent
      tags: [agent]

- name: Operate HA - PostgreSQL
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-ha]
    # Patroni defaults carry lazy Jinja (app_db: postgresql.db_name); expose all PG-cluster
    # defaults at play scope so role `when:` conditions resolve before include_role loads them.
  tasks:
    - name: Apply postgresql role (ha slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: ha
      tags: [postgresql-ha]

- name: Operate scale out - PostgreSQL
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-scale-out]
  tasks:
    - name: Apply postgresql role (scale-out slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: scale-out
      tags: [postgresql-scale-out]

- name: Operate scale in - PostgreSQL
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-scale-in]
  serial: 1
  tasks:
    - name: Apply postgresql role (scale-in slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: scale-in
      tags: [postgresql-scale-in]

- name: Operate migrate - PostgreSQL
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-migrate]
  serial: 1
  tasks:
    - name: Apply postgresql role (migrate slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: migrate
      tags: [postgresql-migrate]

- name: Operate HA - winter-server replicas
  hosts: winter-server
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply winter-server role (ha slice)
      ansible.builtin.include_role:
        name: winter-server
        tasks_from: ha
      tags: [application-ha]

- name: Operate HA - Harbor replicas
  hosts: harbor
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply harbor role (ha slice)
      ansible.builtin.include_role:
        name: harbor
        tasks_from: ha
      when: harbor.enabled | bool
      tags: [application-ha]

- name: Operate HA - Nginx and LVS real servers
  hosts: nginx
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply nginx role (ha slice)
      ansible.builtin.include_role:
        name: nginx
        tasks_from: ha
      tags: [application-ha]

- name: Operate HA - Keepalived Director
  hosts: keepalived
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply keepalived role (ha slice)
      ansible.builtin.include_role:
        name: keepalived
        tasks_from: ha
      when: ha.enabled | bool
      tags: [application-ha]

- name: LVS director (from inventory lvs_role=director)
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [lvs-director]
  tasks:
    - name: Apply lvs-director role
      ansible.builtin.include_role:
        name: lvs-director
      when: lvs_role | default('') == 'director'
      tags: [lvs-director]

- name: LVS real servers (from inventory lvs_role=realserver)
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [lvs-realserver]
  tasks:
    - name: Apply lvs-realserver role
      ansible.builtin.include_role:
        name: lvs-realserver
      when: lvs_role | default('') == 'realserver' and ha.lvs.enabled | default(false) | bool
      tags: [lvs-realserver]

- name: Operate scale out - Observability
  hosts: observability
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [observability-scale-out]
  tasks:
    - name: Apply observability role (scale-out slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-out
      tags: [observability-scale-out]

- name: Operate scale out - Nginx upstream
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [observability-scale-out]
  tasks:
    - name: Apply nginx role (scale-out slice)
      ansible.builtin.include_role:
        name: nginx
        tasks_from: scale-out
      tags: [observability-scale-out]

- name: Operate scale in register - Observability
  hosts: localhost
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [observability-scale-in]
  tasks:
    - name: Apply observability role (scale-in-register slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-in-register
      tags: [observability-scale-in]

- name: Operate scale in - Observability
  hosts: observability
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [observability-scale-in]
  tasks:
    - name: Apply observability role (scale-in slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-in
      tags: [observability-scale-in]

- name: Operate scale in remove - Observability
  hosts: monitoring_scale_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [observability-scale-in]
  tasks:
    - name: Apply observability role (scale-in-remove slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-in-remove
      tags: [observability-scale-in]

- name: Operate scale in - Nginx upstream
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [observability-scale-in]
  tasks:
    - name: Apply nginx role (scale-in slice)
      ansible.builtin.include_role:
        name: nginx
        tasks_from: scale-in
      tags: [observability-scale-in]

- name: Operate destroy - Platform
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [destroy]
  tasks:
    - name: Apply uninstall role (destroy slice)
      ansible.builtin.include_role:
        name: uninstall
        tasks_from: destroy
      tags: [destroy]

- name: Operate destroy - Agents
  hosts: agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [destroy]
  tasks:
    - name: Apply agent role (destroy slice)
      ansible.builtin.include_role:
        name: agent
        tasks_from: destroy
      tags: [destroy]

- name: Deployment acceptance checks
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [verify]
  tasks:
    - name: Apply verify slice acceptance
      ansible.builtin.include_role:
        name: verify
        tasks_from: acceptance
      tags: [verify]

- name: Validate configuration
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [reconfigure]
  tasks:
    - name: Apply reconfigure slice validate
      ansible.builtin.include_role:
        name: reconfigure
        tasks_from: validate
      tags: [reconfigure]

- name: Verify artifacts and version plan
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [upgrade]
  tasks:
    - name: Apply upgrade slice validate
      ansible.builtin.include_role:
        name: upgrade
        tasks_from: validate
      tags: [upgrade]
