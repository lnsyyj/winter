- name: Verify artifacts and version plan
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [upgrade]
  tasks:
    - name: Apply upgrade slice validate
      ansible.builtin.include_role:
        name: upgrade
        tasks_from: validate
      tags: [upgrade]
