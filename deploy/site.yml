---
# winter · single ansible entry point (ADR-43).
#
# Thin orchestration only: every play is `hosts + roles`. ALL task logic lives in
# roles/<name>/tasks/*.yml; each role's main.yml dispatches on winter_ops_action, and
# multi-host operations attach per-host slices via `include_role tasks_from: <slice>`.
#
# Play-level keywords that roles cannot express (vars_files, serial, when) stay here.
# Any failure stops the run (any_errors_fatal) — partial convergence is not a valid state.
#
# Usage: one flat inventory (inventory/hosts.ini); one group per process, IPs listed directly.
#   ./deploy.sh deploy    -t repo-nginx
#   ./deploy.sh prechecks -t postgresql
#   ./deploy.sh deploy    -t postgresql-scale-out \
#       -e '{"pg_scale_overrides":{"nodes":["192.168.101.197","192.168.101.198"]}}'

- name: System checks
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [prechecks]
  roles:
    - role: system-checks
      tags: [prechecks]

- name: OS initialization
  hosts: os-init
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [os-init]
  roles:
    - role: system-init
      tags: [os-init]

- name: Base dependencies and OS settings
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [bootstrap]
  roles:
    - role: bootstrap
      when: bootstrap.enabled | default(true) | bool
      tags: [bootstrap]

- name: Nginx artifact repository
  hosts: repo-nginx
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [repo-nginx]
  roles:
    - role: local-repo
      tags: [repo-nginx]

- name: PostgreSQL single instance
  hosts: postgresql
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql]
  roles:
    - role: postgresql
      tags: [postgresql]

- name: Nginx access layer
  hosts: nginx
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [nginx]
  roles:
    - role: nginx
      tags: [nginx]

- name: VictoriaMetrics stack
  hosts: victoriametrics
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [victoriametrics]
  roles:
    - role: observability
      when: observability.enabled | bool
      tags: [victoriametrics]

- name: Management Server
  hosts: winter-server
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [winter-server]
  roles:
    - role: winter-server
      when: winter_server.enabled | bool
      tags: [winter-server]

- name: Harbor registry
  hosts: harbor
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [harbor]
  roles:
    - role: harbor
      when: harbor.enabled | bool
      tags: [harbor]

- name: Keepalived Director and LVS real servers
  hosts: keepalived
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [keepalived]
  roles:
    - role: keepalived
      when: ha.enabled | bool
      tags: [keepalived]

- name: BIND 9 DNS
  hosts: named
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [named]
  roles:
    - role: named
      when: dns.enabled | bool
      tags: [named]

- name: winter-agent pre-install on managed nodes
  hosts: winter-agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [winter-agent]
  roles:
    - role: agent
      tags: [winter-agent]

- name: Operate HA - PostgreSQL
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-ha]
    # Patroni defaults carry lazy Jinja (app_db: postgresql.db_name); expose all PG-cluster
    # defaults at play scope so role `when:` conditions resolve before include_role loads them.
  tasks:
    - name: Apply postgresql role (ha slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: ha
      tags: [postgresql-ha]

- name: Operate scale out - PostgreSQL
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-scale-out]
  tasks:
    - name: Apply postgresql role (scale-out slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: scale-out
      tags: [postgresql-scale-out]

- name: Operate scale in - PostgreSQL
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-scale-in]
  serial: 1
  tasks:
    - name: Apply postgresql role (scale-in slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: scale-in
      tags: [postgresql-scale-in]

- name: Operate migrate - PostgreSQL
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-migrate]
  serial: 1
  tasks:
    - name: Apply postgresql role (migrate slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: migrate
      tags: [postgresql-migrate]

- name: Operate HA - winter-server replicas
  hosts: winter-server
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply winter-server role (ha slice)
      ansible.builtin.include_role:
        name: winter-server
        tasks_from: ha
      tags: [application-ha]

- name: Operate HA - Harbor replicas
  hosts: harbor
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply harbor role (ha slice)
      ansible.builtin.include_role:
        name: harbor
        tasks_from: ha
      when: harbor.enabled | bool
      tags: [application-ha]

- name: Operate HA - Nginx and LVS real servers
  hosts: nginx
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply nginx role (ha slice)
      ansible.builtin.include_role:
        name: nginx
        tasks_from: ha
      tags: [application-ha]

- name: Operate HA - Keepalived Director
  hosts: keepalived
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [application-ha]
  tasks:
    - name: Apply keepalived role (ha slice)
      ansible.builtin.include_role:
        name: keepalived
        tasks_from: ha
      when: ha.enabled | bool
      tags: [application-ha]

- name: LVS director (hosts in [keepalived-director])
  hosts: keepalived-director
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [lvs-director]
  roles:
    - role: lvs-director
      tags: [lvs-director]

- name: LVS real servers (hosts in [lvs-backend])
  hosts: lvs-backend
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [lvs-realserver]
  roles:
    - role: lvs-realserver
      tags: [lvs-realserver]

- name: Operate scale out - VictoriaMetrics
  hosts: victoriametrics
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [victoriametrics-scale-out]
  tasks:
    - name: Apply observability role (scale-out slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-out
      tags: [victoriametrics-scale-out]

- name: Operate scale out - Nginx upstream
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [victoriametrics-scale-out]
  tasks:
    - name: Apply nginx role (scale-out slice)
      ansible.builtin.include_role:
        name: nginx
        tasks_from: scale-out
      tags: [victoriametrics-scale-out]

- name: Operate scale in register - VictoriaMetrics
  hosts: localhost
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [victoriametrics-scale-in]
  tasks:
    - name: Apply observability role (scale-in-register slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-in-register
      tags: [victoriametrics-scale-in]

- name: Operate scale in - VictoriaMetrics
  hosts: victoriametrics
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [victoriametrics-scale-in]
  tasks:
    - name: Apply observability role (scale-in slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-in
      tags: [victoriametrics-scale-in]

- name: Operate scale in remove - VictoriaMetrics
  hosts: monitoring_scale_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [victoriametrics-scale-in]
  tasks:
    - name: Apply observability role (scale-in-remove slice)
      ansible.builtin.include_role:
        name: observability
        tasks_from: scale-in-remove
      tags: [victoriametrics-scale-in]

- name: Operate scale in - Nginx upstream
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [victoriametrics-scale-in]
  tasks:
    - name: Apply nginx role (scale-in slice)
      ansible.builtin.include_role:
        name: nginx
        tasks_from: scale-in
      tags: [victoriametrics-scale-in]

- name: Operate destroy - Platform
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [destroy]
  tasks:
    - name: Apply uninstall role (destroy slice)
      ansible.builtin.include_role:
        name: uninstall
        tasks_from: destroy
      tags: [destroy]

- name: Operate destroy - winter-agents
  hosts: winter-agent
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [destroy]
  tasks:
    - name: Apply agent role (destroy slice)
      ansible.builtin.include_role:
        name: agent
        tasks_from: destroy
      tags: [destroy]

- name: Deployment acceptance checks
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [verify]
  tasks:
    - name: Apply verify slice acceptance
      ansible.builtin.include_role:
        name: verify
        tasks_from: acceptance
      tags: [verify]

- name: Validate configuration
  hosts: etcd
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [reconfigure]
  tasks:
    - name: Apply reconfigure slice validate
      ansible.builtin.include_role:
