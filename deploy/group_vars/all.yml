# 唯一配置入口（对应 kolla-ansible 的 globals.yml，ADR-17 §2.1）
#
# 规则：
# - 所有可变配置写在这里，playbook / role 内不得硬编码
# - 密码、密钥不进本文件；后续阶段引入 passwords.yml（已被 .gitignore 排除）
# - 改这里之后重跑对应阶段即可（reconfigure / deploy 收敛到新状态）

platform:
  # 平台对外域名（证书与访问入口）
  domain: winter.local
  # 管理面 API 监听端口（唯一对外开放端口，见部署方案 §2）
  https_port: 443

  # 内网软件源（ADR-15）：由管理节点的 Nginx 提供（roles/local_repo 发布）
  # 现场没有外网时，所有 RPM / wheel / 二进制都从这里取
  repo_base_url: "http://192.168.101.194:8082"

  # 镜像仓库（ADR-16）：自建 Harbor，全部镜像经此拉取
  registry_host: ""
  registry_ca_path: ""

  # 数据目录：数据卷与离线包分离存放，避免升级时被清理
  data_dir: /var/lib/winter

  # 认证（ADR-22）：默认只开本地账号；客户有目录服务时填 ldap 并置 enabled: true
  # 约束：必须 TLS；组未命中 role_map 一律无权限（default_role: none）；
  #      本地管理员始终保留（break-glass），目录服务故障不影响其登录
  auth:
    providers: [local, ldap]
    # 会话（ADR-34）：access 短、refresh 长；cache_ttl 决定踢人延迟（0 = 即时但每请求查库）
    session:
      access_ttl_minutes: 15
      refresh_ttl_days: 7
      cache_ttl_seconds: 30
    ldap:
      enabled: false
      url: ""                          # 例：ldaps://dc01.corp.local:636
      starttls: false                  # url 为 ldap:// 时必须置 true
      tls_verify: true
      bind_dn: ""                      # 搜索用服务账号；密码放 passwords.yml（vault_ldap_bind_password）
      base_dn: ""                      # 例：ou=people,dc=corp,dc=local
      # 占位符 {login} / {user_dn} 由平台在登录时替换，**不是 Ansible 变量**（不要写成 {{ }}）
      user_filter: "(sAMAccountName={login})"
      group_base_dn: ""
      group_filter: "(member={user_dn})"
      role_map: {}                     # LDAP 组 DN -> 平台角色，例 {"CN=ceph-admins,OU=groups,DC=corp,DC=local": admin}
      default_role: none               # 未命中映射 = 无权限
      timeout_seconds: 5
      group_cache_ttl_seconds: 300

  # 数据保留期（ADR-32）：可配置，但审计 180 天为硬下限（低于则拒绝启动）
  # 三档参考：精简 7/15/30/180 · 标准 30/30/90/180 · 长留 90/90/365/730
  # 调大前务必看 reconfigure 打印的容量估算，否则几个月后写满盘
  retention:
    logs_days: 30
    metrics_days: 30
    tasks_days: 90
    audit_online_days: 180
    sessions_days: 7

# 部署前检查阈值（与部署方案 §1 的资源估算对齐；Harbor 与可观测性栈占大头）
prechecks:
  management_min_vcpus: 15
  management_min_memory_mb: 24576        # 24G
  management_min_root_free_gb: 350       # 含 Harbor 镜像存储与独立审计库；Harbor 最先被吃满
  ceph_node_min_data_disks: 3
  # M0 阶段用 false：虚拟机常见单盘，先提示不拦截；正式交付改 true
  strict_data_disks: false
  # 内核参数由 bootstrap-servers 设置，M0 手工阶段先只报告
  enforce_kernel: false
  max_clock_offset_seconds: 1.0
  # 需要能解析的域名（证书 / registry / 源），留空则跳过
  required_hosts: []
  # 管理节点部署前必须空闲的端口
  required_free_ports:
    - 80
    - 443
  # 阶段 C1 起完内网源后置 true，才检查源与 Harbor 可达
  check_artifacts: false

# 数据库（role 默认值在 roles/postgresql/defaults；这里只写差异）
# 注意：必须用 postgresql_overrides —— 直接写 postgresql: 会整块替换 role 默认字典，
#      导致未覆盖的键（如 data_dir）变成 undefined。
# 密码不在此文件：见 deploy/passwords.yml 的 vault_pg_password（已 gitignore）
postgresql_overrides:
  # 已在运行的实例优先（留空 = 自动探测）。全新机器会自动装 PGDG 的 17
  major: ""
  db_name: winter
  db_user: winter
  # 默认不动现有实例的参数：调参需要重启，同机有别的业务时会被打断
  tune: false
  # tune=true 时才生效（3GB 单机 + 同机 ceph 的经验值）
  shared_buffers: 256MB
  effective_cache_size: 1GB
  work_mem: 4MB
  maintenance_work_mem: 64MB
  max_connections: 100

# 接入层（叠加式：不改 nginx.conf、不抢 default_server）
# 同上：用 nginx_overrides，只写差异
nginx_overrides:
  server_name: "{{ platform.domain }}"
  # 8080 可能被同机其他服务占用（本机是 argus），平台 API 默认走 8081
  api_upstream: "http://127.0.0.1:8081"
  tls_days: 825

# PostgreSQL 高可用集群（etcd + Patroni + HAProxy）
# 端口全部可配；默认 5433 是为了避开 .194 上 argus 已占用的 5432
pg_cluster:
  scope: winter-pg
  port: 5433                # PG 实例端口（每个节点相同）
  rest_port: 8008           # Patroni REST API
  data_dir: /var/lib/pgsql/17/ha   # 与系统自带的 /data 分开，互不影响
  vip_iface_cidr: "192.168.101.0/24"   # 集群互通网段（pg_hba 与防火墙都用它）
  etcd:
    client_port: 2379
    peer_port: 2380
    data_dir: /var/lib/etcd
  haproxy:
    listen_port: 5434       # 应用连这个端口，永远指向当前主库
    check_interval: 2s
    check_fall: 3
    check_rise: 2

# 可观测性栈（ADR-18 / ADR-33）：默认全装、单节点、全部只监听本机
# 端口、版本、保留期只允许在这里改；role 内不硬编码端口。
# Grafana 经 Nginx /grafana/ 反代（ADR-09），不直接暴露 3000。
monitoring_ports:
  victoriametrics: 8428
  vmalert: 8880
  victorialogs: 9428
  alertmanager: 9093
  grafana: 3000
monitoring_listen_addr: 127.0.0.1
monitoring_data_dir: /var/lib/winter/monitoring
monitoring_config_dir: /etc/winter/monitoring
monitoring_retention_days: 30       # 指标与日志各 30 天；审计在 PG，不进日志系统

observability:
  enabled: true
  bin_dir: /usr/local/bin
  data_dir: "{{ monitoring_data_dir }}"
  config_dir: "{{ monitoring_config_dir }}"
  listen_addr: "{{ monitoring_listen_addr }}"
  run_user: winter-monitor          # 非 root 运行（ADR-19 的同类约束）
  retention_days: "{{ monitoring_retention_days }}"
  tarball_subdir: tarball
  components:
    victoriametrics:
      enabled: true
      tarball: victoria-metrics-linux-amd64-v1.156.0.tar.gz
      binary: victoria-metrics-prod
      port: "{{ monitoring_ports.victoriametrics }}"
      listen_flag: -httpListenAddr
      health_path: /health
      args: "-storageDataPath={{ monitoring_data_dir }}/victoriametrics -retentionPeriod={{ monitoring_retention_days }}d"
    vmalert:
      enabled: true
      tarball: vmalert-linux-amd64-v1.156.0.tar.gz
      binary: vmalert-prod
      port: "{{ monitoring_ports.vmalert }}"
      listen_flag: -httpListenAddr
      health_path: /health
      # 唯一告警规则链路（ADR-18）：M0 用占位规则，接入采集后替换为磁盘水位/任务积压规则
      args: "-datasource.url=http://{{ monitoring_listen_addr }}:{{ monitoring_ports.victoriametrics }} -notifier.url=http://{{ monitoring_listen_addr }}:{{ monitoring_ports.alertmanager }} -rule={{ monitoring_config_dir }}/rules/*.yml -evaluationInterval=15s"
    victorialogs:
      enabled: true
      tarball: victoria-logs-linux-amd64-v1.54.0.tar.gz
      binary: victoria-logs-prod
      port: "{{ monitoring_ports.victorialogs }}"
      listen_flag: -httpListenAddr
      health_path: /health
      args: "-storageDataPath={{ monitoring_data_dir }}/victorialogs -retentionPeriod={{ monitoring_retention_days }}d"
    alertmanager:
      enabled: true
      tarball: alertmanager-0.35.0.linux-amd64.tar.gz
      binary: alertmanager
      port: "{{ monitoring_ports.alertmanager }}"
      listen_flag: --web.listen-address
      health_path: /-/healthy
      args: "--config.file={{ monitoring_config_dir }}/alertmanager.yml --storage.path={{ monitoring_data_dir }}/alertmanager"
    grafana:
      enabled: true
      mode: directory                # 目录式安装（含前端静态资源），不是单文件二进制
      tarball: grafana-9.5.20.linux-amd64.tar.gz
      install_dir: /opt/winter/grafana
      port: "{{ monitoring_ports.grafana }}"
      health_path: /api/health

# Server（Go 单二进制 + systemd）；口令与密钥只在 passwords.yml，不写在这里
winter_server:
  enabled: true
  bin_dir: /usr/local/bin
  config_dir: /etc/winter
  env_file: /etc/winter/server.env
  listen_addr: 127.0.0.1
  port: 8081                        # 与 nginx.api_upstream 保持一致
  app_env: prod
  admin_user: admin
  artifact: winter-server
  bin_subdir: bin
