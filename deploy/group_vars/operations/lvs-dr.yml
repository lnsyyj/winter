---
# Operation variables: enable LVS/DR load balancing (ADR-16 / ADR-42).
# Usage: ./deploy.sh deploy -i inventory/operations/lvs-dr -t application-ha \
#          -e @group_vars/operations/lvs-dr.yml -e vault_keepalived_auth_pass=<secret>
# Only overrides are listed; group_vars/all.yml merges them onto ha_defaults.
ha_overrides:
  enabled: true
  vip: 192.168.101.250
  interface: ens34
  lvs:
    enabled: true
    scheduler: rr
    persistence_timeout: 0
# Multi-replica Servers need the PG HA access point, not localhost (application-ha prerequisite).
server_ha_overrides:
  database_endpoint: haproxy
  database_host: 192.168.101.189
  audit_database_host: 192.168.101.189
