# winter inventory - one group per software name, IPs listed directly (ADR-49).
# Group name = the software running on those hosts (§4.9). No abstract/concept names.
# Group order matches site.yml play order: deploy plays first, then operations.
#
# hosts: all (site.yml plays 1-3: System checks, OS initialization... wait OS init has [os-init]):
#   - System checks    -> hosts: all  (no dedicated group)
#   - Base deps        -> hosts: all  (bootstrap; no dedicated group)
# Config for these lives at the top of group_vars/all.yml (platform.* / prechecks.* / bootstrap.*).

