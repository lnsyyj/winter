# winter unified inventory (ADR-47). One file, all topologies; select with --limit <topology>.
# Group naming: <topology>-<software> states exactly which software runs on which hosts.
# Generic groups (postgresql, nginx, ...) are parents of the per-topology groups so site.yml's
# `hosts: postgresql` keeps working — --limit <topology> narrows it to that topology's hosts.
#
# Topologies: all-in-one | multinode | pgha | lvs-dr | scale-out-agent
# LVS/DR roles: [lvs-dr-director] / [lvs-dr-realserver] (group name = role, see below).

# ===================================================================
# HOSTS BY TOPOLOGY
# ===================================================================

[all-in-one]
localhost ansible_connection=local ansible_host=127.0.0.1

[multinode]
mgr01 ansible_host=10.0.0.11
node01 ansible_host=10.0.0.21
node02 ansible_host=10.0.0.22
node03 ansible_host=10.0.0.23

[pgha]
pg-a ansible_host=192.168.101.197
pg-b ansible_host=192.168.101.198
pg-c ansible_host=192.168.101.194 patroni_disable_standalone=false   # 5432 used by argus

[lvs-dr]
ctl ansible_host=192.168.101.189
node-b ansible_host=192.168.101.197
node-c ansible_host=192.168.101.198

[scale-out-agent]
new-node-01 ansible_host=10.0.0.31
new-node-02 ansible_host=10.0.0.32

# ===================================================================
# PER-TOPOLOGY SOFTWARE GROUPS (group name = software on these hosts)
# ===================================================================

# ---- system-init: every host of each topology ----
[all-in-one-system-init]
localhost
[multinode-system-init]
mgr01
node01
node02
node03
[pgha-system-init]
pg-a
pg-b
pg-c
[lvs-dr-system-init]
ctl
node-b
node-c
[scale-out-agent-system-init]
new-node-01
new-node-02

# ---- postgresql: DB node(s) per topology ----
[all-in-one-postgresql]
localhost
[multinode-postgresql]
mgr01
[pgha-postgresql]
pg-a
pg-b
pg-c
[lvs-dr-postgresql]
ctl
node-b
node-c

# ---- nginx: web/access layer ----
[all-in-one-nginx]
localhost
[multinode-nginx]
mgr01
# pgha has no nginx (PG-only topology); keep the group defined but empty for parent resolution.
[pgha-nginx]
[lvs-dr-nginx]
node-b
node-c

# ---- winter-server ----
[all-in-one-winter-server]
localhost
[multinode-winter-server]
mgr01
[pgha-winter-server]
[lvs-dr-winter-server]
ctl
node-b
node-c

# ---- harbor ----
[all-in-one-harbor]
localhost
[multinode-harbor]
mgr01
[pgha-harbor]
[lvs-dr-harbor]
ctl
node-b
node-c

# ---- keepalived ----
[all-in-one-keepalived]
localhost
[multinode-keepalived]
mgr01
[pgha-keepalived]
[lvs-dr-keepalived]
ctl

# ---- named (BIND DNS) ----
[all-in-one-named]
localhost
[multinode-named]
mgr01
[pgha-named]
[lvs-dr-named]
ctl

# ---- observability ----
[all-in-one-observability]
localhost
[multinode-observability]
mgr01
[pgha-observability]
[lvs-dr-observability]
node-b
node-c

# ---- local-repo ----
[all-in-one-local-repo]
localhost
[multinode-local-repo]
mgr01
[pgha-local-repo]
pg-c
[lvs-dr-local-repo]
ctl

# ---- agent (managed nodes) ----
[multinode-agent]
node01
node02
node03
[scale-out-agent-agent]
new-node-01
new-node-02

# ---- LVS/DR: group name = role (Director / RealServer) ----
[lvs-dr-director]
ctl
[lvs-dr-realserver]
node-b
node-c

# ---- PG HA special groups ----
[pg_primary_candidate]
pg-a
[pg_repo]
pg-c

# ===================================================================
# GENERIC PARENT GROUPS (site.yml `hosts:` targets; --limit narrows to a topology)
# ===================================================================
[management:children]
all-in-one
multinode
pgha
lvs-dr

[system-init:children]
all-in-one-system-init
multinode-system-init
pgha-system-init
lvs-dr-system-init
scale-out-agent-system-init

[postgresql:children]
all-in-one-postgresql
multinode-postgresql
pgha-postgresql
lvs-dr-postgresql

[nginx:children]
all-in-one-nginx
multinode-nginx
pgha-nginx
lvs-dr-nginx

[winter-server:children]
all-in-one-winter-server
multinode-winter-server
pgha-winter-server
lvs-dr-winter-server

[harbor:children]
all-in-one-harbor
multinode-harbor
pgha-harbor
lvs-dr-harbor

[keepalived:children]
all-in-one-keepalived
multinode-keepalived
pgha-keepalived
lvs-dr-keepalived

[named:children]
all-in-one-named
multinode-named
pgha-named
lvs-dr-named

[observability:children]
all-in-one-observability
multinode-observability
pgha-observability
lvs-dr-observability

[local-repo:children]
all-in-one-local-repo
multinode-local-repo
pgha-local-repo
lvs-dr-local-repo

[agent:children]
multinode-agent
scale-out-agent-agent

[lvs-dr:children]
lvs-dr-director
lvs-dr-realserver

# ---- transactional operation groups (need existing [management] members) ----
[postgresql-ha:children]
management
[postgresql-scale-out:children]
management
[postgresql-scale-in:children]
management
[postgresql-migrate:children]
management

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
