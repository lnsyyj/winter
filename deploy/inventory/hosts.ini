# winter unified inventory (ADR-46). All topologies in one file; select with --limit <group>.
# Usage: ./deploy.sh deploy -i inventory/hosts.ini --limit <topology>
#   topologies: all-in-one | multinode | pgha | lvs-dr | scale-out-agent
# Default (no --limit) targets all hosts — always pass --limit for a real operation.
#
# LVS/DR role assignment is expressed by GROUP MEMBERSHIP (clear at a glance):
#   [lvs-dr-director]   -> runs the Keepalived Director (VIP + ipvs virtual_server)
#   [lvs-dr-realserver] -> runs the LVS RealServer (loopback VIP + ARP suppression)
# The lvs-director / lvs-realserver roles read these groups; no -e parameters needed.
# [lvs-dr] is the parent of both, so `--limit lvs-dr` still selects the whole topology.

# ---- topology: single machine (M0, localhost) ----
[all-in-one]
localhost ansible_connection=local ansible_host=127.0.0.1

# ---- topology: multi-node site ----
[multinode]
mgr01 ansible_host=10.0.0.11
node01 ansible_host=10.0.0.21
node02 ansible_host=10.0.0.22
node03 ansible_host=10.0.0.23

# ---- topology: three-node PG HA (Patroni + etcd) ----
[pgha]
pg-a ansible_host=192.168.101.197
pg-b ansible_host=192.168.101.198
pg-c ansible_host=192.168.101.194 patroni_disable_standalone=false   # 5432 used by argus; keep system instance

# ---- topology: LVS/DR (Director + >=2 RealServers) ----
# Group membership defines the role — no lvs_role host variable needed.
[lvs-dr-director]
ctl    ansible_host=192.168.101.189

[lvs-dr-realserver]
node-b ansible_host=192.168.101.197
node-c ansible_host=192.168.101.198

[lvs-dr:children]
lvs-dr-director
lvs-dr-realserver

# ---- topology: scale out agents (new managed nodes) ----
[scale-out-agent]
new-node-01 ansible_host=10.0.0.31
new-node-02 ansible_host=10.0.0.32

# ---- component groups: all point at management unless explicitly split ----
# NOTE: [lvs-dr-director]/[lvs-dr-realserver] decide Director/RealServer, so keepalived/nginx
# may overlap here without breaking LVS/DR.
[management:children]
all-in-one
multinode
pgha
lvs-dr

[observability:children]
management

[keepalived:children]
management

[winter-server:children]
management

[harbor:children]
management

[nginx:children]
management

[local-repo:children]
management

[postgresql:children]
management

[named:children]
management

[system-init:children]
management

[agent:children]
multinode
scale-out-agent

# ---- PG HA special groups ----
[pg_primary_candidate]
pg-a

[pg_repo]
pg-c

# ---- scale-out operations need existing members in [management] ----
[postgresql-ha:children]
management

[postgresql-scale-out:children]
management

[postgresql-scale-in:children]
management

[postgresql-migrate:children]
management

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
