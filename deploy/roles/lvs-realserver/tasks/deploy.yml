---
# Configure an LVS/DR real server (ADR-16): bind the VIP to loopback and suppress ARP so the
# Director can deliver client frames without this node advertising the VIP itself.
# Invoked explicitly via -t lvs-realserver, so LVS mode is implied — force it like lvs-director
# rather than gating on ha.lvs.enabled (which callers may not set).

- name: Force LVS mode for this RealServer
  ansible.builtin.set_fact:
    ha: "{{ ha | combine({'lvs': ha.lvs | combine({'enabled': true})}) }}"
  tags: [lvs, lvs-realserver]

- name: Validate LVS real server configuration
  ansible.builtin.assert:
    that:
      - ha.vip | default('') | length > 0
    fail_msg: "lvs-realserver requires ha.vip in group_vars/all.yml"
    quiet: true
  tags: [lvs, lvs-realserver]

- name: Configure ARP suppression for LVS/DR
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ lvs_realserver.sysctl_path }}"
    mode: "0644"
  notify: apply sysctl settings
  tags: [ha, lvs, lvs-realserver]

- name: Apply sysctl changes immediately
  ansible.builtin.meta: flush_handlers
  tags: [ha, lvs, lvs-realserver]

- name: Install the loopback VIP helper script
  ansible.builtin.template:
    src: winter-lvs-vip.sh.j2
    dest: "{{ lvs_realserver.helper }}"
    mode: "0755"
  tags: [ha, lvs, lvs-realserver]

- name: Install the loopback VIP systemd unit
  ansible.builtin.template:
    src: winter-lvs-vip.service.j2
    dest: "/etc/systemd/system/{{ lvs_realserver.unit }}"
    mode: "0644"
  notify: restart loopback VIP service
  tags: [ha, lvs, lvs-realserver]

- name: Apply unit changes immediately
  ansible.builtin.meta: flush_handlers
  tags: [ha, lvs, lvs-realserver]

- name: Enable and start the loopback VIP service
  ansible.builtin.systemd:
    name: "{{ lvs_realserver.unit }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [ha, lvs, lvs-realserver]

- name: Verify the VIP is present on loopback
  ansible.builtin.shell: |
    set -o pipefail
    ip addr show dev lo | grep -q "{{ lvs_realserver.vip }}/32"
  args:
    executable: /bin/bash
  changed_when: false
  tags: [ha, lvs, lvs-realserver]

- name: Print real server summary
  ansible.builtin.debug:
    msg:
      - "LVS/DR real server: VIP {{ lvs_realserver.vip }} on lo, ARP suppression enabled"
  tags: [ha, lvs, lvs-realserver]
