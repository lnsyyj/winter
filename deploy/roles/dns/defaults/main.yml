---
# Fallback values for the BIND 9 DNS role.
# The authoritative configuration is dns.* in deploy/group_vars/all.yml (ADR-17 single entry point).
# group_vars replaces this dict as a whole, so keep both in sync and set every key there.
dns:
  enabled: false
  # package = dnf from the host's configured repositories; repo = offline RPMs from the internal repo
  install_method: package
  packages:
    - bind
    - bind-utils
  rpm_subdir: rpm/bind                 # path under platform.repo_base_url when install_method=repo
  rpm_dir: "{{ playbook_dir }}/../artifacts/repo/rpm/bind"   # staging check on the control machine
  rpm_files: []                        # required and non-empty when install_method=repo
  service: named
  config_file: /etc/named.conf
  zone_dir: /var/named
  listen_port: 53
  listen_addr: any                     # BIND listen-on address match list
  forwarders: []                       # upstream resolvers for external names
  recursion: false
  dnssec: false
  domain: "{{ platform.domain }}"
  ttl: 60
  admin_mailbox: hostmaster
  # A records published for the domain; empty falls back to ha.vips, then ha.vip
  vips: []
  # Explicit address overrides; empty derives them from [dns_masters] / [dns_slaves] in inventory
  master_addresses: []
  slave_addresses: []
  # TSIG key for master/slave zone transfer; the secret is vault_dns_tsig_secret in passwords.yml
  tsig_key_name: winter-dns
  allow_query_cidrs: []                # empty = any
  allow_transfer_cidrs: []             # empty = TSIG key only on the master
  manage_firewall: true                # open the DNS port with firewalld; false for an external firewall
  check_interval: 60                   # local resolution check retry window (seconds)
