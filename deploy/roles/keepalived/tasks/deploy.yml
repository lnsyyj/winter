---
# Keepalived VRRP on the [keepalived] nodes: a floating VIP fronts the Nginx replicas (ADR-16).
# A failed Nginx health check releases the VIP so the peer can take over.

- name: Validate Keepalived configuration
  ansible.builtin.assert:
    that:
      - keepalived.enabled | bool
      - (keepalived.vips | default([]) | length > 0) or (keepalived.vip | default('') | length > 0)
      - vault_keepalived_auth_pass is defined and vault_keepalived_auth_pass | length > 0
    fail_msg: "keepalived.enabled=true requires keepalived.vip or keepalived.vips, plus vault_keepalived_auth_pass (see group_vars/all.yml.example)"
    quiet: true
  tags: [ha, keepalived]

- name: Validate LVS load balancing configuration
  ansible.builtin.assert:
    that:
      - keepalived.lvs.real_servers | default([]) | length >= 2
      - (keepalived.vips | default([]) | length > 0) or (keepalived.vip | default('') | length > 0)
    fail_msg: "keepalived.lvs.enabled requires at least two [nginx] and keepalived.vip or keepalived.vips"
    quiet: true
  when: keepalived.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

# modprobe was removed from ansible-core; use command guarded by a /sys/module check.
- name: Check whether ip_vs is loaded
  ansible.builtin.stat:
    path: /sys/module/ip_vs
  register: keepalived_ip_vs_loaded
  changed_when: false
  when: keepalived.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Load the ip_vs kernel module
  ansible.builtin.command: modprobe ip_vs
  when:
    - keepalived.lvs.enabled | default(false) | bool
    - not keepalived_ip_vs_loaded.stat.exists
  tags: [ha, keepalived, lvs]

- name: Check whether keepalived is installed
  ansible.builtin.stat:
    path: /usr/sbin/keepalived
  register: keepalived_bin
  tags: [ha, keepalived]

- name: Install keepalived (only if missing)
  ansible.builtin.dnf:
    name: keepalived
    state: present
    disablerepo: "pgdg*"
  when: not keepalived_bin.stat.exists
  tags: [ha, keepalived]

- name: Create keepalived configuration directory
  ansible.builtin.file:
    path: /etc/keepalived
    state: directory
    mode: "0755"
  tags: [ha, keepalived]

- name: Install the Nginx health-check script
  ansible.builtin.template:
    src: check_nginx.sh.j2
    dest: "{{ keepalived.check_script }}"
    mode: "0755"
  notify: restart keepalived
  tags: [ha, keepalived]

- name: Install the LVS health-check script
  ansible.builtin.template:
    src: check_lvs.sh.j2
    dest: "{{ keepalived.lvs_check_script }}"
    mode: "0755"
  notify: restart keepalived
  when: keepalived.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Render keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived.config_path }}"
    mode: "0644"
    backup: true
  notify: restart keepalived
  tags: [ha, keepalived]

- name: Apply configuration changes
  ansible.builtin.meta: flush_handlers
  tags: [ha, keepalived]

- name: Start and enable keepalived
  ansible.builtin.systemd:
    name: "{{ keepalived.service }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [ha, keepalived]

- name: Print Keepalived summary
  ansible.builtin.debug:
    msg:
      - "Keepalived VIPs: {{ ((keepalived.vips | default([]) | length > 0) | ternary(keepalived.vips, [keepalived.vip])) | join(', ') }} on {{ keepalived.interface }}"
      - "The VIP is released when the local health check fails"
  tags: [ha, keepalived]
