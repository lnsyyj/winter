---
# ADR-44 (Plan X): migrated verbatim from roles/application-ha/tasks/keepalived.yml.
# Application HA convergence (migrated from application-ha.yml, ADR-43). Split per host group; site.yml attaches each slice via tasks_from.
# Play 4: Configure the Keepalived Director with LVS load balancing (hosts: keepalived)

# ---- pre_tasks ----

- name: Reject overlapping Director and real server roles
  ansible.builtin.assert:
    that: (not (ha.lvs.enabled | bool)) or (groups['keepalived'] | intersect(groups['nginx']) | length == 0)
    fail_msg: "LVS/DR requires [keepalived] and [nginx] to be disjoint; otherwise the Director and a real server share the same VIP"
    quiet: true
  tags: [application-ha]

- name: Compute replica addresses for upstreams, LVS backends and VRRP peers
  ansible.builtin.set_fact:
    server_upstreams: "{{ groups['winter-server'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
    harbor_upstreams: "{{ groups['harbor'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
    nginx_lvs_backends: "{{ groups['nginx'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
    ha_peer_addresses: "{{ groups['keepalived'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
  tags: [application-ha]

- name: Inject LVS real servers into the Keepalived configuration
  ansible.builtin.set_fact:
    ha: "{{ ha | combine({'lvs': ha.lvs | combine({'real_servers': nginx_lvs_backends})}) }}"
  tags: [application-ha]


# ---- post_tasks ----
- name: Print HA summary
  ansible.builtin.debug:
    msg:
      - "Server upstream: {{ server_upstreams | join(', ') }}"
      - "Harbor upstream: {{ harbor_upstreams | default([]) | join(', ') }}"
      - "LVS/DR backends: {{ nginx_lvs_backends | default([]) | join(', ') }}"
      - "Keepalived VIPs: {{ ((ha.vips | default([]) | length > 0) | ternary(ha.vips, [ha.vip])) | join(', ') }} on {{ ha.interface }}"
  tags: [application-ha]

# ---- roles ----
- name: Apply role keepalived
  ansible.builtin.include_role:
    name: keepalived
  when: ha.enabled | bool
  tags: [application-ha]
