---
# Keepalived VRRP on the [lb] nodes: a floating VIP fronts the Nginx replicas (ADR-16).
# A failed Nginx health check releases the VIP so the peer can take over.

- name: Validate Keepalived configuration
  ansible.builtin.assert:
    that:
      - ha.enabled | bool
      - ha.vip | default('') | length > 0
      - vault_keepalived_auth_pass is defined and vault_keepalived_auth_pass | length > 0
    fail_msg: "ha.enabled=true requires ha.vip and vault_keepalived_auth_pass (see passwords.yml.example)"
    quiet: true
  tags: [ha, keepalived]

- name: Validate LVS load balancing configuration
  ansible.builtin.assert:
    that:
      - ha.lvs.real_servers | default([]) | length >= 2
      - ha.vip | default('') | length > 0
    fail_msg: "ha.lvs.enabled requires at least two [nginx_nodes] and ha.vip"
    quiet: true
  when: ha.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Load the ip_vs kernel module
  ansible.builtin.modprobe:
    name: ip_vs
    state: present
  when: ha.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Check whether keepalived is installed
  ansible.builtin.stat:
    path: /usr/sbin/keepalived
  register: keepalived_bin
  tags: [ha, keepalived]

- name: Install keepalived (only if missing)
  ansible.builtin.dnf:
    name: keepalived
    state: present
    disablerepo: "pgdg*"
  when: not keepalived_bin.stat.exists
  tags: [ha, keepalived]

- name: Create keepalived configuration directory
  ansible.builtin.file:
    path: /etc/keepalived
    state: directory
    mode: "0755"
  tags: [ha, keepalived]

- name: Install the Nginx health-check script
  ansible.builtin.template:
    src: check_nginx.sh.j2
    dest: "{{ keepalived_check_script }}"
    mode: "0755"
  notify: restart keepalived
  tags: [ha, keepalived]

- name: Install the LVS health-check script
  ansible.builtin.template:
    src: check_lvs.sh.j2
    dest: "{{ keepalived_lvs_check_script }}"
    mode: "0755"
  notify: restart keepalived
  when: ha.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Render keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_path }}"
    mode: "0644"
    backup: true
  notify: restart keepalived
  tags: [ha, keepalived]

- name: Apply configuration changes
  ansible.builtin.meta: flush_handlers
  tags: [ha, keepalived]

- name: Start and enable keepalived
  ansible.builtin.systemd:
    name: "{{ keepalived_service }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [ha, keepalived]

- name: Print Keepalived summary
  ansible.builtin.debug:
    msg:
      - "Keepalived VIP {{ ha.vip }} on {{ ha.interface }} (priority {{ ha.priority }})"
      - "The VIP is released when the local Nginx health check fails"
  tags: [ha, keepalived]
