---
# ADR-44 (Plan X): migrated verbatim from roles/postgresql-scale-out/tasks/deploy.yml.
# PostgreSQL HA scale-out (migrated from postgresql-scale-out.yml, ADR-43). Sequential etcd learner/promote; scale-out-member.yml must live in this tasks dir.

# ---- migrated from playbook pre_tasks ----

# Scale targets are already members of [etcd], so the final etcd member count is
# groups['etcd'] | length — NOT management + nodes (the old expression double-counted).
- name: Validate scale-out plan
  ansible.builtin.assert:
    that:
      - pg_scale.nodes | length > 0
      - pg_scale.nodes | unique | length == pg_scale.nodes | length
      - pg_scale.nodes | difference(groups['etcd']) | length == 0
      - (groups['etcd'] | length) % 2 == 1
      - (groups['etcd'] | difference(pg_scale.nodes) | length) >= 1
      - (groups['etcd'] | difference(pg_scale.nodes) | length) != 2
    fail_msg: >-
      pg_scale.nodes must be unique hosts already in [etcd], at least one existing member
      must remain, the existing member count must be odd (1 or >=3), and the final count odd.
    quiet: true
  run_once: true
  tags: [postgresql-scale-out]

- name: Record existing and expected member counts
  ansible.builtin.set_fact:
    pg_existing_members: "{{ groups['etcd'] | difference(pg_scale.nodes) | length }}"
    pg_expected_members: "{{ groups['etcd'] | length }}"
    pg_existing_endpoint: "{{ hostvars[groups['etcd'] | difference(pg_scale.nodes) | first]['ansible_host'] }}"
    # Learner mode is required only when bootstrapping from a single-member cluster.
    pg_use_learner: "{{ (groups['etcd'] | difference(pg_scale.nodes) | length) == 1 }}"
  tags: [postgresql-scale-out]


# ---- migrated from playbook tasks ----
# Add one etcd member at a time, start it, and (in learner mode) promote it before moving on.
# Serial is enforced by the loop with run_once; each iteration fully converges one node.
- name: Add and converge each new cluster member sequentially
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/scale-out-member.yml"
  loop: "{{ pg_scale.nodes }}"
  loop_control:
    loop_var: pg_join_node
    index_var: pg_join_index
    label: "{{ pg_join_node }}"
  tags: [postgresql-scale-out]

# HAProxy backends reference all [etcd] members; converge it once after all joined.
- name: Configure the HAProxy entry point for the grown cluster
  ansible.builtin.include_role:
    name: haproxy
  tags: [postgresql-scale-out]


# ---- migrated from playbook post_tasks ----
- name: Verify the new nodes are streaming replicas
  ansible.builtin.uri:
    url: "http://{{ hostvars[item]['ansible_host'] }}:{{ pg_cluster.rest_port }}/replica"
    status_code: 200
  loop: "{{ pg_scale.nodes }}"
  delegate_to: "{{ groups['etcd'] | difference(pg_scale.nodes) | first }}"
  tags: [postgresql-scale-out]

- name: Report scale-out result
  ansible.builtin.debug:
    msg:
      - "Added {{ pg_scale.nodes | join(', ') }}; etcd members: {{ pg_expected_members }}"
      - "Learner mode used: {{ pg_use_learner }} (single-member bootstrap path)"
  run_once: true
  tags: [postgresql-scale-out]
