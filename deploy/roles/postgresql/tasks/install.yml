---
# Install PostgreSQL 17 from the internal repo (offline path)
#
# Why fetch RPMs manually: the official PGDG site is unreachable on site (verified on real machines in this environment — timeouts),
# and base/EPEL do not provide PG17. The artifacts are checked in to deploy/artifacts/repo/rpm/pgdg17,
# published by roles/repo-nginx via Nginx; fetched here with get_url.
#
# This file is entered only when the machine has no PostgreSQL instance at all.

- name: Clean up leftover staged packages from previous runs (avoid installing stale packages)
  ansible.builtin.file:
    path: "{{ postgresql.rpm_stage_dir }}"
    state: absent
  tags: [postgresql]

- name: Create staging directory
  ansible.builtin.file:
    path: "{{ postgresql.rpm_stage_dir }}"
    state: directory
    mode: "0755"
  tags: [postgresql]

- name: Fetch RPMs from internal repo
  ansible.builtin.get_url:
    url: "{{ repo_nginx.base_url }}/{{ postgresql.rpm_subdir }}/{{ item }}"
    dest: "{{ postgresql.rpm_stage_dir }}/{{ item }}"
    mode: "0644"
    timeout: 60
  loop: "{{ postgresql.rpm_packages }}"
  register: pg_rpm_fetch
  tags: [postgresql]

- name: Fetch extra dependencies from internal repo (e.g. perl-libs, often missing on minimal systems)
  ansible.builtin.get_url:
    url: "{{ repo_nginx.base_url }}/{{ postgresql.rpm_deps_subdir }}/{{ item }}"
    dest: "{{ postgresql.rpm_stage_dir }}/{{ item }}"
    mode: "0644"
    timeout: 60
  loop: "{{ postgresql.rpm_deps }}"
  when: postgresql.rpm_deps | length > 0
  tags: [postgresql]

- name: Install all RPMs in the staging directory locally (no remote repos)
  # Use shell rather than the dnf module: the module does not expand wildcards, and here we want "install whatever is in the staging directory"
  ansible.builtin.shell: |
    set -o pipefail
    dnf -y --disablerepo='*' --nogpgcheck install {{ postgresql.rpm_stage_dir }}/*.rpm
  args:
    executable: /bin/bash
  register: pg_rpm_install
  changed_when: "'Nothing to do' not in pg_rpm_install.stdout"
  tags: [postgresql]

- name: Detect major version of the newly installed instance
  # Cannot use `rpm -q postgresql*-server`: when the shell has no match it passes the literal string as a package name,
  # and rpm reports "package postgresql*-server is not installed". Use rpm -qa + awk instead.
  ansible.builtin.shell: |
    set -o pipefail
    rpm -qa --qf '%{NAME}\t%{VERSION}\n' \
      | awk -F'\t' '$1 ~ /^postgresql[0-9]+-server$/ {split($2,a,"."); print a[1]; exit}'
  args:
    executable: /bin/bash
  register: pg_new_major
  changed_when: false
  failed_when: pg_new_major.stdout | trim | length == 0
  tags: [postgresql]

- name: Record major version
  ansible.builtin.set_fact:
    pg_major: "{{ pg_new_major.stdout | trim }}"
  tags: [postgresql]

- name: Initialize data directory (first time only)
  ansible.builtin.shell: |
    set -o pipefail
    /usr/pgsql-{{ pg_major }}/bin/initdb -D /var/lib/pgsql/{{ pg_major }}/data --encoding=UTF8 --locale=C.UTF-8
  args:
    executable: /bin/bash
    creates: /var/lib/pgsql/{{ pg_major }}/data/PG_VERSION
  become_user: postgres
  tags: [postgresql]
