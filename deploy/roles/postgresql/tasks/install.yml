---
# 从内网源安装 PostgreSQL 17（离线路径）
#
# 为什么要自己拉 RPM：现场 PGDG 官方站不可达（本环境实测超时），
# 而 base/EPEL 里没有 PG17。制品已入库到 deploy/artifacts/repo/rpm/pgdg17，
# 由 roles/local_repo 通过 Nginx 发布，这里用 get_url 取。
#
# 只在「机器上没有任何 PostgreSQL 实例」时进入本文件。

- name: 清理上次遗留的暂存包（避免旧包被一并安装）
  ansible.builtin.file:
    path: "{{ postgresql.rpm_stage_dir }}"
    state: absent
  tags: [postgresql]

- name: 暂存目录
  ansible.builtin.file:
    path: "{{ postgresql.rpm_stage_dir }}"
    state: directory
    mode: "0755"
  tags: [postgresql]

- name: 从内网源取 RPM
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ postgresql.rpm_subdir }}/{{ item }}"
    dest: "{{ postgresql.rpm_stage_dir }}/{{ item }}"
    mode: "0644"
    timeout: 60
  loop: "{{ postgresql.rpm_packages }}"
  register: pg_rpm_fetch
  tags: [postgresql]

- name: 从内网源取额外依赖（如 perl-libs，极简系统常缺）
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ postgresql.rpm_deps_subdir }}/{{ item }}"
    dest: "{{ postgresql.rpm_stage_dir }}/{{ item }}"
    mode: "0644"
    timeout: 60
  loop: "{{ postgresql.rpm_deps }}"
  when: postgresql.rpm_deps | length > 0
  tags: [postgresql]

- name: 本地安装暂存目录下的全部 RPM（不访问任何远端仓库）
  # 用 shell 而非 dnf 模块：模块不展开通配符，而这里要「暂存目录里有什么就装什么」
  ansible.builtin.shell: |
    set -o pipefail
    dnf -y --disablerepo='*' --nogpgcheck install {{ postgresql.rpm_stage_dir }}/*.rpm
  args:
    executable: /bin/bash
  register: pg_rpm_install
  changed_when: "'Nothing to do' not in pg_rpm_install.stdout"
  tags: [postgresql]

- name: 探测新装实例的主版本
  ansible.builtin.shell: |
    set -o pipefail
    rpm -q --qf '%{VERSION}\n' postgresql*-server 2>/dev/null | head -1 | cut -d. -f1
  args:
    executable: /bin/bash
  register: pg_new_major
  changed_when: false
  tags: [postgresql]

- name: 记录主版本
  ansible.builtin.set_fact:
    pg_major: "{{ pg_new_major.stdout | trim }}"
  tags: [postgresql]

- name: 初始化数据目录（仅首次）
  ansible.builtin.shell: |
    set -o pipefail
    /usr/pgsql-{{ pg_major }}/bin/initdb -D /var/lib/pgsql/{{ pg_major }}/data --encoding=UTF8 --locale=C.UTF-8
  args:
    executable: /bin/bash
    creates: /var/lib/pgsql/{{ pg_major }}/data/PG_VERSION
  become_user: postgres
  tags: [postgresql]
