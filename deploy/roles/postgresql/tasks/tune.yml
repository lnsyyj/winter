---
# Optional: memory and connection parameter tuning (requires an instance restart)
# Only runs when postgresql.tune=true; do not enable when other services run on the same machine

- name: Record parameters before tuning
  ansible.builtin.shell: |
    set -o pipefail
    sudo -u postgres psql -tAc "select name||'='||setting from pg_settings where name in ('shared_buffers','work_mem','max_connections') order by 1"
  args:
    executable: /bin/bash
  register: pg_before
  changed_when: false
  tags: [postgresql-tune]

- name: Apply ALTER SYSTEM for each parameter
  ansible.builtin.shell: |
    set -o pipefail
    sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET {{ item.key }} = '{{ item.value }}'"
  loop:
    - { key: shared_buffers, value: "{{ postgresql.shared_buffers }}" }
    - { key: effective_cache_size, value: "{{ postgresql.effective_cache_size }}" }
    - { key: work_mem, value: "{{ postgresql.work_mem }}" }
    - { key: maintenance_work_mem, value: "{{ postgresql.maintenance_work_mem }}" }
    - { key: max_connections, value: "{{ postgresql.max_connections }}" }
    - { key: listen_addresses, value: "{{ postgresql.listen_addresses }}" }
    - { key: port, value: "{{ postgresql.port }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: restart postgresql
  tags: [postgresql-tune]

- name: Restart after tuning and read back
  ansible.builtin.meta: flush_handlers
  tags: [postgresql-tune]

- name: Read back key parameters
  ansible.builtin.shell: |
    set -o pipefail
    sudo -u postgres psql -tAc "select name||'='||setting from pg_settings where name in ('shared_buffers','work_mem','max_connections') order by 1"
  args:
    executable: /bin/bash
  register: pg_after
  changed_when: false
  tags: [postgresql-tune]

- name: Compare parameters
  ansible.builtin.debug:
    msg:
      - "Before: {{ pg_before.stdout_lines | join(' ') }}"
      - "After: {{ pg_after.stdout_lines | join(' ') }}"
  tags: [postgresql-tune]
