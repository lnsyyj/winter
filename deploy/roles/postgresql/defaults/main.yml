---
# PostgreSQL role 默认值
# 原则：优先「收敛已有实例」，没有才安装；不覆盖别人的库与配置。
postgresql:
  # 目标主版本。留空 = 自动探测（已在跑的实例优先）
  major: ""

  # 空 = 自动探测（show data_directory）
  data_dir: ""

  # 连接与库
  port: 5432
  listen_addresses: "127.0.0.1"
  db_name: winter
  db_user: winter

  # 已存在角色时是否强制同步密码（默认 false：不动别人可能已改过的口令）
  force_password: false

  # 是否调整内存参数。默认 false —— 调整需要重启实例，会中断同机其他应用（如 argus）
  tune: false

  # tune=true 时生效（3GB 单机 + 同机 ceph 的经验值，独立管理节点可上调）
  shared_buffers: 256MB
  effective_cache_size: 1GB
  work_mem: 4MB
  maintenance_work_mem: 64MB
  max_connections: 100

  # 本 role 自分发时的日志行数上限（避免 no_log 掩盖排障信息时输出过大）
  service_name: ""   # 空 = postgresql-{{ major }}
