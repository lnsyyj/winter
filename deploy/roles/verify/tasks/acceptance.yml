---
# Deployment acceptance checks (migrated from post-deploy.yml, ADR-43).
# Play 1: Verify deployment and record the release manifest (hosts: etcd)

# ---- pre_tasks ----


# ---- tasks ----
- name: Verify internal artifact repo is reachable
  ansible.builtin.uri:
    url: "{{ platform.repo_base_url }}/SHA256SUMS.txt"
    method: HEAD
    status_code: 200
  register: postdeploy_repo
  retries: 3
  delay: 2
  until: postdeploy_repo.status is defined and postdeploy_repo.status == 200
  tags: [post-deploy]

- name: Verify Server health endpoint
  # HA mode binds the Server to each node's internal address (winter_server.listen_addr is
  # overridden by app-ha); probing 127.0.0.1 then gets connection refused. Use ansible_host,
  # which matches both single-node (loopback is reachable via the host IP) and HA deployments.
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ winter_server.port }}/healthz"
    status_code: 200
  register: postdeploy_server
  tags: [post-deploy]

- name: Verify Nginx site with the platform Host header
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ platform.https_port }}/healthz"
    headers:
      Host: "{{ platform.domain }}"
    validate_certs: false
    status_code: 200
  register: postdeploy_nginx
  tags: [post-deploy]

- name: Verify API reverse proxy
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ platform.https_port }}/api/v1/healthz"
    headers:
      Host: "{{ platform.domain }}"
    validate_certs: false
    status_code: 200
  register: postdeploy_api
  failed_when: false
  tags: [post-deploy]

- name: Verify local monitoring health endpoints
  ansible.builtin.uri:
    url: "http://{{ victoriametrics_listen_addr }}:{{ item.value.port }}{{ item.value.health_path }}"
    status_code: 200
  loop: "{{ victoriametrics.components | dict2items }}"
  when: victoriametrics.enabled | bool and item.value.enabled | bool and item.value.health_path is defined
  tags: [post-deploy]

- name: Record deployment manifest
  ansible.builtin.copy:
    dest: "{{ platform.data_dir }}/deployment-manifest.yml"
    mode: "0644"
    content: |
      # Generated by ./deploy.sh post-deploy; do not edit by hand.
      version: "{{ platform.version | default('unspecified') }}"
      deployed_at: "{{ ansible_date_time.iso8601 }}"
      domain: "{{ platform.domain }}"
      repo_base_url: "{{ platform.repo_base_url }}"
      server_port: {{ winter_server.port }}
      pg_port: {{ (postgresql | default({})).port | default(pg_cluster.port) }}
      pg_entry_port: {{ pg_cluster.haproxy.listen_port }}
      components:
        victoriametrics: "{{ victoriametrics.components.victoriametrics.tarball }}"
        vmalert: "{{ victoriametrics.components.vmalert.tarball }}"
        victorialogs: "{{ victoriametrics.components.victorialogs.tarball }}"
        alertmanager: "{{ victoriametrics.components.alertmanager.tarball }}"
        grafana: "{{ victoriametrics.components.grafana.tarball }}"
        server: "{{ winter_server.artifact }}"
  tags: [post-deploy]

- name: Print acceptance summary
  ansible.builtin.debug:
    msg:
      - "Internal repo: {{ platform.repo_base_url }} (200)"
      - "Server: {{ postdeploy_server.status }}; Nginx site: {{ postdeploy_nginx.status }}"
      - "API reverse proxy: {{ postdeploy_api.status | default('not available') }}"
      - "Manifest: {{ platform.data_dir }}/deployment-manifest.yml"
  tags: [post-deploy]
