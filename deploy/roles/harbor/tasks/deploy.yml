---
# Harbor (ADR-16): fetch the offline installer from the internal repo, render harbor.yml and start
# it with docker-compose. Two modes:
#   builtin  (MVP single node, default): bundled PostgreSQL/Redis, local data volume, no external
#            dependencies. Only the admin password is required.
#   external (V1 HA): shared external PostgreSQL, Redis and an NFS volume; all replicas share data.
# Docker and docker-compose are site prerequisites; this role fails explicitly when they are absent.

- name: Validate Harbor prerequisites
  ansible.builtin.assert:
    that:
      - harbor.enabled | bool
      - harbor.hostname | default('') | length > 0
      - (harbor.mode | default('builtin')) in ['builtin', 'external']
      - vault_harbor_admin_password is defined and vault_harbor_admin_password | length > 0
    fail_msg: "Harbor requires a hostname and vault_harbor_admin_password; mode must be builtin or external"
    quiet: true
  tags: [harbor]

- name: Validate Harbor external-mode prerequisites
  ansible.builtin.assert:
    that:
      - harbor.database.host | default('') | length > 0
      - harbor.redis.host | default('') | length > 0
      - harbor.storage.nfs_server | default('') | length > 0
      - harbor.storage.nfs_path | default('') | length > 0
      - vault_harbor_db_password is defined and vault_harbor_db_password | length > 0
      - vault_harbor_redis_password is defined and vault_harbor_redis_password | length > 0
    fail_msg: "harbor.mode=external requires external DB/Redis/NFS addresses and their vault passwords; use builtin mode otherwise"
    quiet: true
  when: (harbor.mode | default('builtin')) == 'external'
  tags: [harbor]

- name: Check docker-compose is available
  ansible.builtin.command: "{{ harbor_compose_command }} version"
  register: harbor_compose_version
  changed_when: false
  failed_when: false
  tags: [harbor]

- name: Fail with an actionable message when docker-compose is missing
  ansible.builtin.assert:
    that: harbor_compose_version.rc == 0
    fail_msg: "docker-compose is required on Harbor nodes but was not found; install Docker and compose before running this stage"
    quiet: true
  tags: [harbor]

- name: Create Harbor directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ harbor.install_dir }}"
    - "{{ harbor_staging_dir }}"
  tags: [harbor]

# Builtin mode stores all data (including bundled PG/Redis) on a local volume.
- name: Create the local data volume (builtin mode)
  ansible.builtin.file:
    path: "{{ harbor.local_volume | default(harbor.data_dir + '/data') }}"
    state: directory
    mode: "0755"
  when: (harbor.mode | default('builtin')) == 'builtin'
  tags: [harbor]

# External mode: all replicas share an NFS-backed volume.
- name: Create the NFS mount point (external mode)
  ansible.builtin.file:
    path: "{{ harbor.storage.mount_point }}"
    state: directory
    mode: "0755"
  when: (harbor.mode | default('builtin')) == 'external'
  tags: [harbor]

- name: Persist the NFS share in fstab (external mode)
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^{{ harbor.storage.nfs_server }}:{{ harbor.storage.nfs_path }} "
    line: "{{ harbor.storage.nfs_server }}:{{ harbor.storage.nfs_path }} {{ harbor.storage.mount_point }} nfs {{ harbor.storage.options }} 0 0"
    state: present
    backup: true
  when: (harbor.mode | default('builtin')) == 'external'
  tags: [harbor]

- name: Mount the shared NFS storage (external mode)
  ansible.builtin.shell: |
    set -euo pipefail
    if ! findmnt -T "{{ harbor.storage.mount_point }}" >/dev/null 2>&1; then
      mount -t nfs -o "{{ harbor.storage.options }}" \
        "{{ harbor.storage.nfs_server }}:{{ harbor.storage.nfs_path }}" \
        "{{ harbor.storage.mount_point }}"
      echo mounted
    else
      echo already-mounted
    fi
  args:
    executable: /bin/bash
  register: harbor_mount
  changed_when: harbor_mount.stdout | trim == 'mounted'
  when: (harbor.mode | default('builtin')) == 'external'
  tags: [harbor]

- name: Fetch the Harbor offline installer from the internal repo
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ harbor.tarball_subdir }}/{{ harbor.tarball }}"
    dest: "{{ harbor_staging_dir }}/{{ harbor.tarball }}"
    mode: "0644"
    timeout: 600
  tags: [harbor]

- name: Extract the Harbor offline installer
  ansible.builtin.unarchive:
    src: "{{ harbor_staging_dir }}/{{ harbor.tarball }}"
    dest: "{{ harbor.install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ harbor.install_dir }}/install.sh"
  tags: [harbor]

- name: Render harbor.yml (external DB / Redis / shared storage)
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ harbor.install_dir }}/harbor.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  tags: [harbor]

# The offline installer ships all images as harbor.v<version>.tar.gz, but ./prepare runs
# `docker run goharbor/prepare:<version>` and docker-compose up pulls the component images.
# On an offline site the archive MUST be loaded into the local Docker daemon first; otherwise
# Docker tries to reach Docker Hub and fails. Idempotent: skip when the prepare image exists.
- name: Load the bundled Harbor images into the local Docker daemon
  ansible.builtin.shell: |
    set -euo pipefail
    if docker image inspect "goharbor/prepare:{{ harbor.version }}" >/dev/null 2>&1; then
      echo already-loaded
    else
      # harbor.version already carries the 'v' prefix (v2.11.0); archive is harbor.v2.11.0.tar.gz
      docker load -i "{{ harbor.install_dir }}/harbor.{{ harbor.version }}.tar.gz"
      echo loaded
    fi
  args:
    executable: /bin/bash
  register: harbor_image_load
  changed_when: harbor_image_load.stdout is search('^loaded$', 'multiline')
  tags: [harbor]

- name: Prepare and start Harbor
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ harbor.install_dir }}"
    ./prepare
    {{ harbor_compose_command }} up -d
  args:
    executable: /bin/bash
  register: harbor_start
  changed_when: "'Creating' in harbor_start.stdout or 'Recreating' in harbor_start.stdout or 'Starting' in harbor_start.stdout"
  tags: [harbor]

- name: Wait for the Harbor health endpoint
  ansible.builtin.uri:
    url: "http://{{ harbor.bind_addr }}:{{ harbor.http_port }}{{ harbor.health_path }}"
    status_code: 200
  register: harbor_health
  until: harbor_health.status is defined and harbor_health.status == 200
  retries: "{{ obs_health_retries | default(30) | int }}"
  delay: "{{ obs_health_delay | default(2) | int }}"
  tags: [harbor]

- name: Print Harbor summary (builtin mode)
  ansible.builtin.debug:
    msg:
      - "Harbor {{ harbor.mode | default('builtin') }}: {{ harbor.hostname }} (bind {{ harbor.bind_addr }}:{{ harbor.http_port }})"
      - "Bundled PostgreSQL/Redis with local data volume: {{ harbor.local_volume | default(harbor.data_dir + '/data') }}"
  when: (harbor.mode | default('builtin')) == 'builtin'
  tags: [harbor]

- name: Print Harbor summary (external mode)
  ansible.builtin.debug:
    msg:
      - "Harbor replica: {{ harbor.hostname }} (bind {{ harbor.bind_addr }}:{{ harbor.http_port }})"
      - "Shared data: {{ harbor.storage.nfs_server }}:{{ harbor.storage.nfs_path }} on {{ harbor.storage.mount_point }}"
      - "External PostgreSQL: {{ harbor.database.host }}:{{ harbor.database.port }}/{{ harbor.database.name }}"
      - "External Redis: {{ harbor.redis.host }}:{{ harbor.redis.port }}"
  when: (harbor.mode | default('builtin')) == 'external'
  tags: [harbor]
