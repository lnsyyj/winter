---
# etcd: distributed configuration and leader-election backend for Patroni (3 nodes, odd count, Raft)
etcd_role:
  # Binary source (official static package from the internal repo)
  tarball: etcd-v3.5.17-linux-amd64.tar.gz
  tarball_subdir: tarball
  bin_dir: /usr/local/bin

# Cluster members are generated automatically from the inventory's management group
etcd_nodes: "{{ groups['management'] }}"
