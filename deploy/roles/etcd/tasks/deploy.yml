---
# etcd: install binary, write unit, start service, verify cluster health
# Leader election relies on Raft quorum, so there must be 3 (or 5) nodes

- name: Create staging directory
  ansible.builtin.file:
    path: /var/tmp/winter-etcd
    state: directory
    mode: "0755"
  tags: [etcd]

- name: Fetch etcd static package from internal repo
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ etcd_role.tarball_subdir }}/{{ etcd_role.tarball }}"
    dest: /var/tmp/winter-etcd/{{ etcd_role.tarball }}
    mode: "0644"
    timeout: 60
  tags: [etcd]

- name: Install binary
  ansible.builtin.unarchive:
    src: /var/tmp/winter-etcd/{{ etcd_role.tarball }}
    dest: /var/tmp/winter-etcd/
    remote_src: true
  tags: [etcd]

- name: Copy etcd / etcdctl
  ansible.builtin.copy:
    src: "/var/tmp/winter-etcd/etcd-v3.5.17-linux-amd64/{{ item }}"
    dest: "{{ etcd_role.bin_dir }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: [etcd, etcdctl]
  tags: [etcd]

- name: Create data directory
  ansible.builtin.file:
    path: "{{ pg_cluster.etcd.data_dir }}"
    state: directory
    owner: root
    mode: "0700"
  tags: [etcd]

- name: Render unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: restart etcd
  tags: [etcd]

- name: Start service and enable start on boot
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true
  tags: [etcd]

- name: Allow etcd ports through firewall (cluster subnet only)
  ansible.builtin.shell: |
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ pg_cluster.vip_iface_cidr }} port port={{ pg_cluster.etcd.client_port }} protocol=tcp accept' >/dev/null 2>&1
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ pg_cluster.vip_iface_cidr }} port port={{ pg_cluster.etcd.peer_port }} protocol=tcp accept' >/dev/null 2>&1
    firewall-cmd --reload >/dev/null 2>&1
    echo done
  register: etcd_fw
  changed_when: false
  failed_when: false
  tags: [etcd]

# During incremental scale-out the cluster grows one member at a time, so the target is the count
# after this member joined (pg_healthy_target), not the final cluster size. Count STARTED members
# from `member list` rather than `endpoint health --cluster`: a learner is a valid started member
# but rejects the health RPC, so --cluster would never converge during the learner phase.
- name: Wait for cluster health (quorum ready)
  ansible.builtin.shell: |
    set -o pipefail
    target="{{ pg_healthy_target | default(pg_expected_members | default(groups['etcd'] | length)) }}"
    for i in $(seq 1 60); do
      started=$({{ etcd_role.bin_dir }}/etcdctl \
        --endpoints=http://{{ hostvars[groups['etcd'] | difference((pg_scale | default({})).removed_nodes | default([])) | first]['ansible_host'] }}:{{ pg_cluster.etcd.client_port }} \
        member list 2>/dev/null | grep -c 'started')
      [ "$started" -eq "$target" ] && exit 0
      sleep 2
    done
    echo "etcd cluster did not reach $target started members within 120s" >&2
    exit 1
  args:
    executable: /bin/bash
  register: etcd_health
  changed_when: false
  failed_when: etcd_health.rc != 0
  tags: [etcd]

# Query a voting member's endpoint: a learner rejects etcdctl RPCs, so using ansible_host fails
# during a learner-based scale-out. This task is diagnostic only, so never fail the whole run.
- name: List members
  ansible.builtin.shell: |
    set -o pipefail
    {{ etcd_role.bin_dir }}/etcdctl \
      --endpoints=http://{{ pg_existing_endpoint | default(ansible_host) }}:{{ pg_cluster.etcd.client_port }} \
      member list -w table
  args:
    executable: /bin/bash
  register: etcd_members
  changed_when: false
  failed_when: false
  tags: [etcd]

- name: Show members
  ansible.builtin.debug:
    msg: "{{ etcd_members.stdout_lines | default([]) }}"
  run_once: true
  tags: [etcd]
