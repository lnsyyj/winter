---
# etcd：装二进制、写 unit、起服务、验证集群健康
# 选主靠 Raft 多数派，所以必须是 3（或 5）个节点

- name: 暂存目录
  ansible.builtin.file:
    path: /var/tmp/winter-etcd
    state: directory
    mode: "0755"
  tags: [etcd]

- name: 从内网源取 etcd 静态包
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ etcd_role.tarball_subdir }}/{{ etcd_role.tarball }}"
    dest: /var/tmp/winter-etcd/{{ etcd_role.tarball }}
    mode: "0644"
    timeout: 60
  tags: [etcd]

- name: 安装二进制
  ansible.builtin.unarchive:
    src: /var/tmp/winter-etcd/{{ etcd_role.tarball }}
    dest: /var/tmp/winter-etcd/
    remote_src: true
  tags: [etcd]

- name: 复制 etcd / etcdctl
  ansible.builtin.copy:
    src: "/var/tmp/winter-etcd/etcd-v3.5.17-linux-amd64/{{ item }}"
    dest: "{{ etcd_role.bin_dir }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: [etcd, etcdctl]
  tags: [etcd]

- name: 数据目录
  ansible.builtin.file:
    path: "{{ pg_cluster.etcd.data_dir }}"
    state: directory
    owner: root
    mode: "0700"
  tags: [etcd]

- name: 渲染 unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: restart etcd
  tags: [etcd]

- name: 启动并开机自启
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true
  tags: [etcd]

- name: 防火墙放行 etcd 端口（仅集群网段）
  ansible.builtin.shell: |
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ pg_cluster.vip_iface_cidr }} port port={{ pg_cluster.etcd.client_port }} protocol=tcp accept' >/dev/null 2>&1
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ pg_cluster.vip_iface_cidr }} port port={{ pg_cluster.etcd.peer_port }} protocol=tcp accept' >/dev/null 2>&1
    firewall-cmd --reload >/dev/null 2>&1
    echo done
  register: etcd_fw
  changed_when: false
  failed_when: false
  tags: [etcd]

- name: 等待集群健康（多数派就绪）
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 60); do
      {{ etcd_role.bin_dir }}/etcdctl \
        --endpoints=http://{{ hostvars[groups['management'][0]].ansible_host }}:{{ pg_cluster.etcd.client_port }} \
        endpoint health --cluster 2>/dev/null | grep -c "is healthy" | grep -q 3 && exit 0
      sleep 2
    done
    echo "etcd 集群未在 120s 内达到 3 个健康成员" >&2
    exit 1
  args:
    executable: /bin/bash
  register: etcd_health
  changed_when: false
  failed_when: etcd_health.rc != 0
  tags: [etcd]

- name: 成员列表
  ansible.builtin.shell: |
    set -o pipefail
    {{ etcd_role.bin_dir }}/etcdctl --endpoints=http://{{ ansible_host }}:{{ pg_cluster.etcd.client_port }} member list -w table
  args:
    executable: /bin/bash
  register: etcd_members
  changed_when: false
  tags: [etcd]

- name: 输出成员
  ansible.builtin.debug:
    msg: "{{ etcd_members.stdout_lines }}"
  run_once: true
  tags: [etcd]
