---
# Role-owned defaults (ADR-63). Site overrides live in group_vars/all.yml
# as <name>_overrides; do not edit defaults here for site-specific values.

bootstrap_defaults:
  enabled: true

  # Base OS packages and clock synchronization were extracted into roles/os-init,
  # which can run on its own. Configure them with os_init_overrides in group_vars/all.yml.

  # ADR-64: prechecks strictly enforce kernel parameters, so bootstrap must write them.
  # Set bootstrap_overrides.enforce_kernel=false only if the host image already ships them.
  enforce_kernel: true
  sysctl_file: /etc/sysctl.d/99-winter.conf
  sysctl:
    vm.overcommit_memory: 1
    vm.max_map_count: 262144
    net.bridge.bridge-nf-call-iptables: 1
    net.bridge.bridge-nf-call-ip6tables: 1

  # Optional data disk. Both destructive steps are opt-in: nothing is formatted or mounted by default.
  data_disk:
    device: ""
    mount_point: /data
    filesystem: xfs
    format_if_empty: false
    mount: false

bootstrap: "{{ bootstrap_defaults | combine(bootstrap_overrides | default({}, true), recursive=True) }}"

