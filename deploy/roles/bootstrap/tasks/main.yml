---
# bootstrap-servers: install base dependencies and apply the settings that prechecks only reports.
# Read-only by default for kernel/disk settings; those become effective only when explicitly enabled.

- name: Confirm this is a supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "RedHat"
    fail_msg: "Only RHEL family distributions are supported (CentOS Stream 9 / RHEL 9); actual: {{ ansible_facts.distribution }}"
    quiet: true
  tags: [bootstrap]

- name: Collect installed RPM names
  ansible.builtin.shell: |
    set -o pipefail
    rpm -qa --qf '%{NAME}\n' | sort -u
  args:
    executable: /bin/bash
  register: bootstrap_installed_rpms
  changed_when: false
  tags: [bootstrap]

- name: Install missing base packages
  # Query first, then install only what is missing: on sites with unreachable third-party repos,
  # a blind dnf call hangs even when every package is already present.
  ansible.builtin.dnf:
    name: "{{ bootstrap.packages | difference(bootstrap_installed_rpms.stdout_lines) }}"
    state: present
  when: bootstrap.packages | difference(bootstrap_installed_rpms.stdout_lines) | length > 0
  tags: [bootstrap]

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
  when: bootstrap.enable_chrony | bool and 'chrony' in bootstrap.packages
  tags: [bootstrap]

- name: Render winter sysctl profile
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ bootstrap.sysctl_file }}"
    mode: "0644"
  register: bootstrap_sysctl_file
  when: bootstrap.enforce_kernel | bool
  tags: [bootstrap]

- name: Load br_netfilter module
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present
  when: bootstrap.enforce_kernel | bool
  tags: [bootstrap]

- name: Apply winter sysctl profile
  ansible.builtin.command: "sysctl -p {{ bootstrap.sysctl_file }}"
  when: bootstrap.enforce_kernel | bool and bootstrap_sysctl_file is changed
  changed_when: false
  tags: [bootstrap]

- name: Check data device filesystem
  ansible.builtin.command: "blkid -o value -s TYPE {{ bootstrap.data_disk.device }}"
  register: bootstrap_disk_fstype
  changed_when: false
  failed_when: false
  when:
    - bootstrap.data_disk.device | length > 0
    - bootstrap.data_disk.format_if_empty | bool or bootstrap.data_disk.mount | bool
  tags: [bootstrap]

- name: Create filesystem on data device (only when explicitly enabled and empty)
  ansible.builtin.filesystem:
    fstype: "{{ bootstrap.data_disk.filesystem }}"
    dev: "{{ bootstrap.data_disk.device }}"
  when:
    - bootstrap.data_disk.device | length > 0
    - bootstrap.data_disk.format_if_empty | bool
    - bootstrap_disk_fstype.stdout | trim | length == 0
  tags: [bootstrap]

- name: Mount data device
  ansible.builtin.mount:
    path: "{{ bootstrap.data_disk.mount_point }}"
    src: "{{ bootstrap.data_disk.device }}"
    fstype: "{{ bootstrap.data_disk.filesystem }}"
    state: mounted
    opts: defaults
  when:
    - bootstrap.data_disk.device | length > 0
    - bootstrap.data_disk.mount | bool
  tags: [bootstrap]

- name: Report bootstrap result
  ansible.builtin.debug:
    msg:
      - "Base packages: {{ bootstrap.packages | join(', ') }}"
      - "Kernel settings applied: {{ bootstrap.enforce_kernel | bool }} (profile {{ bootstrap.sysctl_file }})"
      - "Data device: {{ bootstrap.data_disk.device | default('none', true) }} (format={{ bootstrap.data_disk.format_if_empty }}, mount={{ bootstrap.data_disk.mount }})"
  tags: [bootstrap]
