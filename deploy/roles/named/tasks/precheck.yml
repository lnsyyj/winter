---
# Read-only DNS prechecks. Every command/shell task sets changed_when: false; nothing is installed,
# no config is written and no firewall rule is changed. Run with: ./deploy.sh named --tags precheck.named
- name: Precheck DNS | Derive VIP addresses
  ansible.builtin.set_fact:
    dns_check_vips: >-
      {{ named.vips | default([]) if (named.vips | default([]) | length > 0)
         else (keepalived.vips | default([]) if (keepalived.vips | default([]) | length > 0)
         else ([keepalived.vip] if (keepalived.vip | default('') | length > 0) else [])) }}

- name: Precheck DNS | Validate basic configuration
  ansible.builtin.assert:
    that:
      - named.enabled | bool
      - named.domain | default('') | length > 0
      - named.listen_port | int > 0
      - named.install_method in ['package', 'repo']
      - (dns_check_vips | length) > 0
    fail_msg: >-
      Invalid DNS configuration: enabled={{ named.enabled }}, domain={{ named.domain | default('') }},
      listen_port={{ named.listen_port }}, install_method={{ named.install_method }},
      vips={{ dns_check_vips | default([]) }}. Set named.domain and either named.vips, keepalived.vips or keepalived.vip
      in group_vars/all.yml; supported install methods are package and repo.
    success_msg: "DNS configuration is valid: domain={{ named.domain }}, vips={{ dns_check_vips | join(',') }}"
    quiet: true

- name: Precheck DNS | Validate topology
  ansible.builtin.assert:
    that:
      - (groups['named'] | default([]) | length) > 0
      - (groups['dns_masters'] | default(groups['named'] | default([])) | length) > 0
    fail_msg: >-
      No DNS servers found. Add hosts to [named] (and optionally [dns_masters] / [dns_slaves])
      in the inventory; topology must be expressed with groups, never with hostname checks.
    success_msg: "DNS topology is valid: nodes={{ groups['named'] | default([]) | join(',') }}"
    quiet: true

- name: Precheck DNS | Check master/slave configuration
  ansible.builtin.assert:
    that:
      - >-
        (groups['dns_slaves'] | default([]) | length) == 0
        or (vault_dns_tsig_secret | default('') | length) > 0
    fail_msg: >-
      DNS slaves are configured but vault_dns_tsig_secret is missing in deploy/group_vars/all.yml.
      Copy group_vars/all.yml.example, generate a base64 HMAC-SHA256 key (for example
      "openssl rand -base64 32") and set vault_dns_tsig_secret before deploying slaves.
    success_msg: "DNS master/slave prerequisites are satisfied"
    quiet: true

- name: Precheck DNS | Check package source availability
  ansible.builtin.assert:
    that:
      - >-
        named.install_method != 'repo'
        or ((named.rpm_files | default([]) | length) > 0
            and (named.rpm_subdir | default('') | length) > 0)
    fail_msg: >-
      named.install_method=repo requires a non-empty named.rpm_files list and a named.rpm_subdir path.
      Place the BIND RPMs under deploy/artifacts/repo/{{ named.rpm_subdir | default('rpm/bind') }}
      and list their filenames in named.rpm_files, or switch to named.install_method=package.
    success_msg: "DNS package source is configured: {{ named.install_method }}"
    quiet: true

- name: Precheck DNS | Check offline RPM staging directory (control machine)
  ansible.builtin.find:
    paths: "{{ named.rpm_dir }}"
    patterns: "*.rpm"
    file_type: file
  delegate_to: localhost
  connection: local
  register: dns_local_rpms
  changed_when: false
  when: named.install_method == 'repo'

- name: Precheck DNS | Offline RPMs are present on the control machine
  ansible.builtin.assert:
    that: dns_local_rpms.files | default([]) | length > 0
    fail_msg: >-
      No BIND RPMs found in {{ named.rpm_dir }} on the control machine. Run the artifact fetch
      script on a machine with internet access, or switch named.install_method to package.
    success_msg: "BIND RPMs found: {{ dns_local_rpms.files | default([]) | length }}"
    quiet: true
  when: named.install_method == 'repo'

- name: Precheck DNS | Inspect DNS port usage
  ansible.builtin.shell: "ss -H -lntup '( sport = :{{ named.listen_port }} )' || true"
  register: dns_port_usage
  changed_when: false
  failed_when: false

- name: Precheck DNS | DNS port is free or owned by a releasable service
  ansible.builtin.assert:
    that:
      - >-
        dns_port_usage.stdout == ''
        or ('named' in dns_port_usage.stdout)
        or (named.manage_systemd_resolved | default(true) | bool and 'systemd-resolve' in dns_port_usage.stdout)
    fail_msg: >-
      Port {{ named.listen_port }} is occupied by another process: {{ dns_port_usage.stdout }}.
      Enable named.manage_systemd_resolved to let the role release a systemd-resolved stub listener,
      stop the conflicting process, or change named.listen_port in group_vars/all.yml before deploying DNS.
    success_msg: "DNS port {{ named.listen_port }} is available or will be released before BIND starts"
    quiet: true

- name: Precheck DNS | Firewall management tool is available
  ansible.builtin.command: firewall-cmd --state
  register: dns_firewall_state
  changed_when: false
  failed_when: false

- name: Precheck DNS | Report firewall tool availability
  ansible.builtin.assert:
    that: dns_firewall_state.rc == 0
    fail_msg: >-
      firewall-cmd is not usable on {{ inventory_hostname }} (rc={{ dns_firewall_state.rc }}).
      Install firewalld or set named.manage_firewall: false and open {{ named.listen_port }}/tcp and
      /udp with the site firewall tool before deploying DNS.
    success_msg: "firewall-cmd is available"
    quiet: true
