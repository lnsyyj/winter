---
# System initialization role defaults: base OS tools and clock synchronization.
# All tunables live in group_vars/all.yml as system_init_overrides (ADR-17 single configuration entry point).
# Merge rule: write only differences in system_init_overrides; do not define system_init directly.
system_init_defaults:
  enabled: true

  # Base OS packages. In an offline site these come from the OS installation media,
  # not from the platform's internal artifact repo (which carries platform artifacts only).
  packages:
    - podman
    - python3
    - python3-pip
    - curl
    - wget
    - chrony

  chrony:
    enabled: true
    service: chronyd
    config_file: /etc/chrony.conf
    include_dir: /etc/chrony.d
    include_file: /etc/chrony.d/winter.conf
    # Empty keeps the distribution's default time sources. Non-empty appends an include file with
    # these servers; existing configuration is never overwritten or removed.
    servers: []

system_init: "{{ system_init_defaults | combine(system_init_overrides | default({}, true), recursive=True) }}"
