---
# Read-only prechecks for system initialization. No package install, no file write, no service change.
- name: Precheck system init | Confirm a supported distribution
  ansible.builtin.assert:
    that: ansible_facts.os_family == "RedHat"
    fail_msg: "Only RHEL family distributions are supported; actual: {{ ansible_facts.distribution }}"
    quiet: true

- name: Precheck system init | Validate configuration
  ansible.builtin.assert:
    that:
      - system_init.packages | default([]) | length > 0
      - system_init.chrony.service | default('') | length > 0
      - system_init.chrony.config_file | default('') | length > 0
      - system_init.chrony.include_dir | default('') | length > 0
      - system_init.chrony.include_file | default('') | length > 0
      - not (system_init.chrony.enabled | default(false) | bool) or ('chrony' in system_init.packages)
    fail_msg: >-
      Invalid system initialization configuration: packages={{ system_init.packages | default([]) }},
      chrony.service={{ system_init.chrony.service | default('') }},
      config_file={{ system_init.chrony.config_file | default('') }},
      include_file={{ system_init.chrony.include_file | default('') }}. Set system_init_overrides in
      group_vars/all.yml; chrony must be listed in packages when chrony is enabled.
    success_msg: "System initialization configuration is valid"
    quiet: true

- name: Precheck system init | Validate NTP server entries
  ansible.builtin.assert:
    that: system_init.chrony.servers | default([]) | select('search', '\s') | list | length == 0
    fail_msg: >-
      NTP server entries must be single tokens without whitespace; got
      {{ system_init.chrony.servers | default([]) }}. Use hostnames or IPs such as time.corp.local.
    success_msg: "NTP server entries are valid"
    quiet: true
  when: (system_init.chrony.servers | default([]) | length) > 0

- name: Precheck system init | Chrony configuration parent directory exists
  ansible.builtin.stat:
    path: "{{ system_init.chrony.config_file | dirname }}"
  register: system_init_chrony_parent
  changed_when: false

- name: Precheck system init | Chrony configuration parent is present
  ansible.builtin.assert:
    that: system_init_chrony_parent.stat.exists
    fail_msg: "Parent directory of system_init.chrony.config_file ({{ system_init.chrony.config_file }}) does not exist."
    success_msg: "Chrony configuration parent directory exists"
    quiet: true

- name: Precheck system init | Inspect chronyd service unit
  ansible.builtin.command: "systemctl cat {{ system_init.chrony.service }}"
  register: system_init_chrony_unit
  changed_when: false
  failed_when: false

- name: Precheck system init | Report chronyd unit availability
  ansible.builtin.debug:
    msg: "chronyd unit present: {{ system_init_chrony_unit.rc == 0 }} (installed packages will create it if absent)"
