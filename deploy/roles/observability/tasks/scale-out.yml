---
# ADR-44 (Plan X): migrated verbatim from roles/observability-scale-out/tasks/monitor.yml.
# Observability scale-out (migrated from observability-scale-out.yml, ADR-43).
# Play 1: Scale out monitoring components and rewire cross-node references (hosts: victoriametrics)

# ---- pre_tasks ----

- name: Confirm this is a supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "RedHat"
    fail_msg: "Only RHEL family distributions are supported; actual: {{ ansible_facts.distribution }}"
    quiet: true
  tags: [observability-scale-out]

- name: Validate monitoring scale-out plan
  ansible.builtin.assert:
    that:
      - monitoring_scale.nodes | length > 0
      - monitoring_scale.nodes | unique | length == monitoring_scale.nodes | length
      - (monitoring_scale.nodes | difference(groups['victoriametrics'])) | length == 0
      - groups['victoriametrics'] | length >= 2
    fail_msg: "monitoring_scale.nodes must be non-empty, unique, already listed in [victoriametrics]; scale-out needs at least two monitor nodes"
    quiet: true
  run_once: true
  tags: [observability-scale-out]

- name: Bind monitoring components to the internal network on multi-node setups
  ansible.builtin.set_fact:
    monitoring_bind_addr: "0.0.0.0"
    monitoring_advertise_addr: "{{ ansible_host | default(monitoring_listen_addr) }}"
  tags: [observability-scale-out]

- name: Compute active monitor peer addresses
  ansible.builtin.set_fact:
    monitor_peers: >-
      {{ groups['victoriametrics'] | difference(monitoring_scale.removed_nodes | default([]))
         | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
  tags: [observability-scale-out]

- name: Compute the metrics query endpoint used by Grafana and vmalert
  ansible.builtin.set_fact:
    monitoring_metrics_url: >-
      {{ monitoring_scale.metrics_query_url if (monitoring_scale.metrics_query_url | default('') | length > 0)
         else (hostvars[(groups['victoriametrics'] | difference(monitoring_scale.removed_nodes | default([])) | first)]['ansible_host']
               | default(monitoring_listen_addr)) }}
  tags: [observability-scale-out]

- name: Compute the Server endpoint used by the Alertmanager webhook
  ansible.builtin.set_fact:
    monitoring_server_url: >-
      {{ hostvars[groups['etcd'] | first]['ansible_host'] | default(monitoring_listen_addr) }}
  tags: [observability-scale-out]

- name: Point vmalert at every Alertmanager replica
  ansible.builtin.set_fact:
    monitoring_vmalert_notifiers: >-
      {{ groups['victoriametrics'] | difference(monitoring_scale.removed_nodes | default([]))
         | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
  tags: [observability-scale-out]


# ---- post_tasks ----
- name: Print monitoring scale-out summary
  ansible.builtin.debug:
    msg:
      - "Monitor nodes: {{ groups['victoriametrics'] | join(', ') }}"
      - "Alertmanager gossip peers: {{ monitor_peers | join(', ') }}"
      - "Metrics query endpoint: {{ monitoring_metrics_url }}"
      - "Grafana and vmalert are stateless and can be added incrementally"
      - "VictoriaMetrics / VictoriaLogs remain single-node local storage; configure monitoring_scale.metrics_query_url for aggregation"
  tags: [observability-scale-out]


# ---- roles ----
- name: Apply role observability
  ansible.builtin.include_role:
    name: observability
  tags: [observability-scale-out]
