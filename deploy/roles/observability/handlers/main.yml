---
# 配置或 unit 变更才重启；notify 名由 unit 渲染任务按组件 key 生成
- name: restart victoriametrics
  ansible.builtin.systemd:
    name: winter-victoriametrics
    state: restarted
    daemon_reload: true

- name: restart vmalert
  ansible.builtin.systemd:
    name: winter-vmalert
    state: restarted
    daemon_reload: true

- name: restart victorialogs
  ansible.builtin.systemd:
    name: winter-victorialogs
    state: restarted
    daemon_reload: true

- name: restart alertmanager
  ansible.builtin.systemd:
    name: winter-alertmanager
    state: restarted
    daemon_reload: true

- name: restart grafana
  ansible.builtin.systemd:
    name: winter-grafana
    state: restarted
    daemon_reload: true
