---
# Configuration validation (migrated from reconfigure.yml, ADR-43).
# Play 1: Validate configuration before reconfigure (hosts: etcd)

# ---- tasks ----

- name: Confirm audit retention meets the hard floor (ADR-32)
  ansible.builtin.assert:
    that: winter_server.retention.audit_online_days >= 180
    fail_msg: "winter_server.retention.audit_online_days must be at least 180 (ADR-32 hard floor); actual: {{ winter_server.retention.audit_online_days }}"
    quiet: true
  tags: [reconfigure]

- name: Confirm configured ports are unique
  ansible.builtin.assert:
    that: candidate_ports | length == candidate_ports | unique | length
    fail_msg: "Duplicate listening ports configured: {{ candidate_ports }}"
    quiet: true
  vars:
    # The internal repo port is the single source of truth in group_vars/all.yml.
    repo_port: "{{ repo_nginx_listen_port }}"
    candidate_ports: "{{ [site.https_port, winter_server.port, patroni.port, patroni.rest_port, haproxy.listen_port, repo_port] + victoriametrics_ports.values() | list }}"
  tags: [reconfigure]

- name: Report effective configuration
  ansible.builtin.debug:
    msg:
      - "Domain {{ site.domain }}; HTTPS {{ site.https_port }}; Server {{ winter_server.port }}"
      - "PG {{ patroni.port }} → entry {{ haproxy.listen_port }}; Patroni REST {{ patroni.rest_port }}"
      - "Retention logs/metrics/tasks/audit: {{ winter_server.retention.logs_days }}/{{ winter_server.retention.metrics_days }}/{{ winter_server.retention.tasks_days }}/{{ winter_server.retention.audit_online_days }}"
  tags: [reconfigure]
