---
# Local static artifact repository (ADR-15 internal repo): publishes the repo's artifacts as an HTTP directory
#
# Location: deploy/artifacts/repo/ (checked in, carried to offline sites along with the code)
# Service: Nginx over plaintext HTTP, accessible only from the internal subnet; port 443 is avoided so nodes need not trust a CA

local_repo:
  # Artifact source (directory on the control machine)
  src: "{{ playbook_dir }}/../artifacts/repo"
  # Publish directory (Nginx root)
  root: "{{ platform.data_dir }}/www/repo"
  listen_port: 8082
  # Subnet allowed to access (change to the actual internal subnet on site)
  allow_cidr: "192.168.101.0/24"
