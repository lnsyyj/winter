---
# Publish the local artifact repository
# Constraints: read-only directory + plaintext HTTP + restricted source subnet; no private keys/certificates
#
# The repo site is served by Nginx, which may not be present on a fresh node. Keep this role
# standalone-capable: install and start Nginx here if missing, without triggering a dnf metadata
# refresh on hosts that already have it (third-party repos such as pgdg may be unreachable).
- name: Check whether nginx is installed
  ansible.builtin.stat:
    path: /usr/sbin/nginx
  register: repo_nginx_bin
  tags: [repo]

- name: Install nginx for the local repository site (only if missing)
  ansible.builtin.dnf:
    name: nginx
    state: present
    disablerepo: "pgdg*"
  when: not repo_nginx_bin.stat.exists
  tags: [repo]

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  tags: [repo]

- name: Ensure the nginx configuration directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "0755"
  tags: [repo]

- name: Create publish directory
  ansible.builtin.file:
    path: "{{ local_repo.root }}"
    state: directory
    mode: "0755"
  tags: [repo]

- name: Sync artifacts (rpm / tarball / pip)
  ansible.builtin.copy:
    src: "{{ local_repo.src }}/"
    dest: "{{ local_repo.root }}/"
    mode: preserve
    directory_mode: "0755"
  tags: [repo]

- name: Gather publish statistics
  ansible.builtin.shell: |
    set -o pipefail
    find {{ local_repo.root }} -type f | wc -l
    du -sh {{ local_repo.root }} | awk '{print $1}'
  args:
    executable: /bin/bash
  register: repo_stat
  changed_when: false
  tags: [repo]

- name: Install Nginx repo site
  ansible.builtin.template:
    src: repo.conf.j2
    dest: /etc/nginx/conf.d/winter-repo.conf
    mode: "0644"
    backup: true
  notify: reload nginx
  tags: [repo]

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: repo_nginx_test
  changed_when: false
  failed_when: repo_nginx_test.rc != 0
  tags: [repo]

- name: Apply changes
  ansible.builtin.meta: flush_handlers
  tags: [repo]

- name: Allow firewall port (internal subnet only)
  ansible.builtin.shell: |
    set -euo pipefail
    rule='rule family=ipv4 source address={{ local_repo.allow_cidr }} port port={{ local_repo.listen_port }} protocol=tcp accept'
    # Use --query-rich-rule to decide, rather than treating the --reload success as a change:
    # the latter would report changed on every deploy (TC-26 requires changed=0 on the second run).
    if firewall-cmd --permanent --query-rich-rule="$rule" >/dev/null 2>&1; then
      echo unchanged
    else
      firewall-cmd --permanent --add-rich-rule="$rule" >/dev/null
      firewall-cmd --reload >/dev/null
      echo added
    fi
  args:
    executable: /bin/bash
  register: repo_fw
  changed_when: "'added' in repo_fw.stdout"
  failed_when: false
  tags: [repo]

- name: Self-check (local machine)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sS --max-time 5 -o /dev/null -w "%{http_code}" "http://127.0.0.1:{{ local_repo.listen_port }}/"
  args:
    executable: /bin/bash
  register: repo_selfcheck
  changed_when: false
  failed_when: repo_selfcheck.stdout | trim != "200"
  tags: [repo]

- name: Report result
  ansible.builtin.debug:
    msg:
      - "Artifact repo: http://{{ ansible_facts.default_ipv4.address }}:{{ local_repo.listen_port }}/  (root {{ local_repo.root }})"
      - "File count {{ repo_stat.stdout_lines[0] }}, size {{ repo_stat.stdout_lines[1] }}"
      - "Only {{ local_repo.allow_cidr }} is allowed to access"
  tags: [repo]
