---
# Deploy the Server single binary + systemd (ADR-14: no compilation on site, only fetch artifacts from the internal repo)
#
# Overwriting a running binary triggers ETXTBSY, so use mv to atomically replace the inode,
# rather than cp/install writing the original file directly; only content changes trigger a restart.

- name: Validate deployment passwords are complete (fail explicitly if any is missing, do not generate weak passwords)
  ansible.builtin.assert:
    that:
      - vault_pg_password is defined and vault_pg_password | length > 0
      - vault_jwt_secret is defined and vault_jwt_secret | length >= 32
      - vault_admin_password is defined and vault_admin_password | length > 0
    fail_msg: "deploy/passwords.yml is missing vault_pg_password / vault_jwt_secret(>=32) / vault_admin_password"
    quiet: true
  tags: [server]

- name: Create service account
  ansible.builtin.user:
    name: "{{ server_run_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
  tags: [server]

- name: Create config and staging directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    # /etc/winter is a shared parent for all winter service accounts (server, monitor, ...).
    # Keep it world-traversable so siblings can reach their own 0750 config subdirectories;
    # secrets remain protected by the 0640 files inside those subdirectories.
    - { path: "{{ winter_server.config_dir }}", mode: "0755", owner: "{{ server_run_user }}" }
    - { path: /var/tmp/winter-server, mode: "0755" }
  tags: [server]

- name: Fetch Server binary from internal repo
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ winter_server.bin_subdir }}/{{ winter_server.artifact }}"
    dest: "/var/tmp/winter-server/winter-server.new"
    mode: "0755"
    timeout: 120
  tags: [server]

- name: Install binary (skip if unchanged; same-directory mv avoids ETXTBSY)
  ansible.builtin.shell: |
    set -euo pipefail
    src=/var/tmp/winter-server/winter-server.new
    dst={{ winter_server.bin_dir }}/{{ winter_server.artifact }}
    if [ -x "$dst" ] && cmp -s "$src" "$dst"; then
      echo unchanged
    else
      # Copy to the target directory first, then replace atomically: keep the source file so get_url stays idempotent,
      # and do not write directly to the running binary (which would trigger ETXTBSY).
      cp "$src" "$dst.new"
      chmod 0755 "$dst.new"
      mv "$dst.new" "$dst"
      echo installed
    fi
  args:
    executable: /bin/bash
  register: server_install
  changed_when: "'installed' in server_install.stdout"
  notify: restart winter-server
  tags: [server]

- name: Render environment file (contains passwords, 0640)
  ansible.builtin.template:
    src: server.env.j2
    dest: "{{ winter_server.env_file }}"
    owner: "{{ server_run_user }}"
    group: "{{ server_run_user }}"
    mode: "0640"
    backup: true
  notify: restart winter-server
  tags: [server]

- name: Render systemd unit
  ansible.builtin.template:
    src: winter-server.service.j2
    dest: /etc/systemd/system/winter-server.service
    mode: "0644"
    backup: true
  notify: restart winter-server
  tags: [server]

- name: Apply changes (restart first)
  ansible.builtin.meta: flush_handlers
  tags: [server]

- name: Start and enable on boot
  ansible.builtin.systemd:
    name: winter-server
    state: started
    enabled: true
    daemon_reload: true
  tags: [server]

- name: Wait for /healthz
  ansible.builtin.uri:
    url: "http://{{ winter_server.listen_addr }}:{{ winter_server.port }}/healthz"
    status_code: 200
    return_content: false
  register: server_health
  until: server_health.status is defined and server_health.status == 200
  retries: "{{ server_health_retries | int }}"
  delay: "{{ server_health_delay | int }}"
  tags: [server]

- name: Print summary
  ansible.builtin.debug:
    msg:
      - "Server: {{ winter_server.listen_addr }}:{{ winter_server.port }} (systemd: winter-server)"
      - "Nginx reverse proxy /api/ -> {{ nginx.api_upstream | default('not configured (server stage runs standalone)', true) }}; confirm both ports match"
      - "Migrations and the break-glass administrator are handled automatically at process startup"
  tags: [server]
