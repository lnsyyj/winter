---
# Patroni: form three PG nodes into one primary and two replicas, and let etcd handle leader election
#
# Order: disable standalone instance → install patroni (offline wheels) → write config → start service → wait for cluster to form

- name: Disable system-provided PostgreSQL service (avoid competing with Patroni for the instance)
  ansible.builtin.systemd:
    name: "postgresql-{{ patroni.pg_major }}"
    state: stopped
    enabled: false
  when: (patroni_disable_standalone | default(patroni.disable_standalone_pg)) | bool
  tags: [patroni]

- name: Check pip3 is available (minimal systems often lack it)
  ansible.builtin.shell: |
    set -o pipefail
    command -v pip3 >/dev/null 2>&1 && echo present || echo missing
  args:
    executable: /bin/bash
  register: pip_probe
  changed_when: false
  tags: [patroni]

- name: Install python3-pip (only if missing; from OS repository)
  # Base OS packages are outside our artifact repository (provided with the OS image); offline sites must bring their own OS repo
  ansible.builtin.dnf:
    name: python3-pip
    state: present
    disablerepo: "pgdg*"
  when: pip_probe.stdout | trim == 'missing'
  tags: [patroni]

- name: Install patroni from internal repo (offline wheels, no PyPI access)
  ansible.builtin.shell: |
    set -o pipefail
    # python-etcd is a dependency of Patroni's etcd3 implementation (without it patroni only recognizes consul/kubernetes)
    # This package only has an sdist, so --no-build-isolation is required; otherwise pip tries to fetch setuptools online
    pip3 install --no-index --no-build-isolation \
      --trusted-host $(echo {{ platform.repo_base_url }} | sed -E 's#https?://([^:/]+).*#\1#') \
      --find-links {{ platform.repo_base_url }}/{{ patroni.pip_subdir }}/ \
      patroni psycopg2-binary python-etcd 2>&1 | tail -3
  args:
    executable: /bin/bash
  register: patroni_pip
  changed_when: "'Successfully installed' in patroni_pip.stdout"
  tags: [patroni]

- name: Create configuration directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    mode: "0755"
  tags: [patroni]

- name: Create data directory (separate from the system instance)
  ansible.builtin.file:
    path: "{{ pg_cluster.data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  tags: [patroni]

- name: Install patroni.yml
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart patroni
  tags: [patroni]

- name: Install post_bootstrap script (create app database on first primary)
  ansible.builtin.template:
    src: post_bootstrap.sh.j2
    dest: /etc/patroni/post_bootstrap.sh
    owner: postgres
    group: postgres
    mode: "0755"
  tags: [patroni]

- name: Install systemd unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: restart patroni
  tags: [patroni]

- name: Start service and enable start on boot
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true
    daemon_reload: true
  tags: [patroni]

- name: Allow PG and REST ports through firewall (cluster subnet only)
  ansible.builtin.shell: |
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ pg_cluster.vip_iface_cidr }} port port={{ pg_cluster.port }} protocol=tcp accept' >/dev/null 2>&1
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ pg_cluster.vip_iface_cidr }} port port={{ pg_cluster.rest_port }} protocol=tcp accept' >/dev/null 2>&1
    firewall-cmd --reload >/dev/null 2>&1
    echo done
  changed_when: false
  failed_when: false
  tags: [patroni]

- name: Wait for local node REST API to be ready
  ansible.builtin.shell: |
    set -o pipefail
    for i in $(seq 1 40); do
      curl -s --max-time 2 http://{{ ansible_host }}:{{ pg_cluster.rest_port }}/ | grep -q '"state"' && exit 0
      sleep 3
    done
    echo "patroni REST not ready" >&2
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
  tags: [patroni]

- name: Check cluster status
  ansible.builtin.shell: |
    set -o pipefail
    patronictl -c /etc/patroni/patroni.yml list 2>&1 | head -8
  args:
    executable: /bin/bash
  register: patroni_list
  changed_when: false
  run_once: true
  tags: [patroni]

- name: Show cluster status
  ansible.builtin.debug:
    msg: "{{ patroni_list.stdout_lines }}"
  run_once: true
  tags: [patroni]
