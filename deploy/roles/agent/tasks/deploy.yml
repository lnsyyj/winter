---
# Agent pre-install on a managed node (ADR-35). Private keys never leave the node (ADR-28).
# The service only starts once a certificate has been issued; until then the CSR is staged for enrollment.

- name: Confirm Agent scaling is enabled
  ansible.builtin.assert:
    that: agent.enabled | bool
    fail_msg: "agent.enabled is false; set agent_overrides.enabled: true in group_vars/all.yml"
    quiet: true
  tags: [agent, scale-out]

- name: Validate Agent configuration
  ansible.builtin.assert:
    that:
      - agent.server_address | length > 0
      - agent.cert.ca_source | length > 0
      - agent.cert.enrollment_mode in ['local_csr', 'preissued']
      - agent.cert.enrollment_mode != 'preissued' or (agent.cert.preissued_key_source | length > 0 and agent.cert.preissued_cert_source | length > 0)
    fail_msg: "Agent needs server_address, cert.ca_source and a valid enrollment_mode; preissued mode also needs preissued_key_source/preissued_cert_source"
    quiet: true
  tags: [agent, scale-out]

- name: Verify CA certificate exists on the control machine
  ansible.builtin.stat:
    path: "{{ agent.cert.ca_source }}"
  delegate_to: localhost
  become: false
  register: agent_ca_local
  tags: [agent, scale-out]

- name: Fail with an actionable message when the CA is missing
  ansible.builtin.assert:
    that: agent_ca_local.stat.exists
    fail_msg: "CA certificate not found at '{{ agent.cert.ca_source }}' on the control machine; configure agent_overrides.cert.ca_source with the CA that signs Agent certificates"
    quiet: true
  tags: [agent, scale-out]

- name: Verify Agent artifact is published in the internal repo
  ansible.builtin.uri:
    url: "{{ platform.repo_base_url }}/{{ agent.bin_subdir }}/{{ agent.artifact }}"
    method: HEAD
    status_code: 200
  delegate_to: localhost
  become: false
  register: agent_artifact_probe
  until: agent_artifact_probe.status is defined and agent_artifact_probe.status == 200
  retries: 3
  delay: 2
  tags: [agent, scale-out]

- name: Create Agent service account
  ansible.builtin.user:
    name: "{{ agent.run_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
  tags: [agent, scale-out]

- name: Create Agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ agent.run_user }}"
    group: "{{ agent.run_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ agent.config_dir }}", mode: "0750" }
    - { path: "{{ agent.cert.dir }}", mode: "0700" }
    - { path: "{{ agent.log_dir }}", mode: "0750" }
    - { path: /var/tmp/winter-agent, mode: "0755" }
  tags: [agent, scale-out]

- name: Install CA certificate on the node
  ansible.builtin.copy:
    src: "{{ agent.cert.ca_source }}"
    dest: "{{ agent.cert.dir }}/{{ agent.cert.ca }}"
    owner: "{{ agent.run_user }}"
    group: "{{ agent.run_user }}"
    mode: "0644"
  tags: [agent, scale-out]

- name: Install pre-issued private key
  ansible.builtin.copy:
    src: "{{ agent.cert.preissued_key_source }}"
    dest: "{{ agent.cert.dir }}/{{ agent.cert.key }}"
    owner: "{{ agent.run_user }}"
    group: "{{ agent.run_user }}"
    mode: "0600"
  when: agent.cert.enrollment_mode == 'preissued'
  tags: [agent, scale-out]

- name: Install pre-issued certificate
  ansible.builtin.copy:
    src: "{{ agent.cert.preissued_cert_source }}"
    dest: "{{ agent.cert.dir }}/{{ agent.cert.cert }}"
    owner: "{{ agent.run_user }}"
    group: "{{ agent.run_user }}"
    mode: "0644"
  when: agent.cert.enrollment_mode == 'preissued'
  tags: [agent, scale-out]

- name: Generate private key locally on the node
  ansible.builtin.command: "openssl genrsa -out {{ agent.cert.dir }}/{{ agent.cert.key }} {{ agent.cert.key_bits }}"
  args:
    creates: "{{ agent.cert.dir }}/{{ agent.cert.key }}"
  when: agent.cert.enrollment_mode == 'local_csr'
  tags: [agent, scale-out]

- name: Set private key ownership and mode
  ansible.builtin.file:
    path: "{{ agent.cert.dir }}/{{ agent.cert.key }}"
    owner: "{{ agent.run_user }}"
    group: "{{ agent.run_user }}"
    mode: "0600"
  tags: [agent, scale-out]

- name: Generate CSR with node identity (private key stays on the node)
  ansible.builtin.command: >-
    openssl req -new
    -key {{ agent.cert.dir }}/{{ agent.cert.key }}
    -out {{ agent.cert.dir }}/{{ agent.cert.csr }}
    -subj "/CN={{ agent.node_id }}"
    -addext "subjectAltName=URI:spiffe://winter/node/{{ agent.node_id }}"
  args:
    creates: "{{ agent.cert.dir }}/{{ agent.cert.csr }}"
  when: agent.cert.enrollment_mode == 'local_csr'
  tags: [agent, scale-out]

- name: Fetch Agent binary from internal repo
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ agent.bin_subdir }}/{{ agent.artifact }}"
    dest: "/var/tmp/winter-agent/{{ agent.artifact }}.new"
    mode: "0755"
    timeout: 120
  tags: [agent, scale-out]

- name: Install binary (same-directory mv avoids ETXTBSY)
  ansible.builtin.shell: |
    set -euo pipefail
    src=/var/tmp/winter-agent/{{ agent.artifact }}.new
    dst={{ agent.bin_dir }}/{{ agent.artifact }}
    if [ -x "$dst" ] && cmp -s "$src" "$dst"; then
      echo unchanged
    else
      cp "$src" "$dst.new"
      chmod 0755 "$dst.new"
      mv "$dst.new" "$dst"
      echo installed
    fi
  args:
    executable: /bin/bash
  register: agent_install
  changed_when: "'installed' in agent_install.stdout"
  tags: [agent, scale-out]

- name: Render Agent environment file
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ agent.env_file }}"
    owner: "{{ agent.run_user }}"
    group: "{{ agent.run_user }}"
    mode: "0640"
  tags: [agent, scale-out]

- name: Render systemd unit
  ansible.builtin.template:
    src: winter-agent.service.j2
    dest: /etc/systemd/system/winter-agent.service
    mode: "0644"
  tags: [agent, scale-out]

- name: Render sudo whitelist
  ansible.builtin.template:
    src: sudoers.j2
    dest: "{{ agent.sudo.file }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: agent.sudo.enabled | bool
  tags: [agent, scale-out]

- name: Check whether a certificate has been issued
  ansible.builtin.stat:
    path: "{{ agent.cert.dir }}/{{ agent.cert.cert }}"
  register: agent_cert_local
  tags: [agent, scale-out]

- name: Apply changes (restart only when a certificate exists)
  ansible.builtin.meta: flush_handlers
  tags: [agent, scale-out]

- name: Start and enable Agent
  ansible.builtin.systemd:
    name: winter-agent
    state: started
    enabled: true
    daemon_reload: true
  when: agent_cert_local.stat.exists
  tags: [agent, scale-out]

- name: Verify Agent service is active
  ansible.builtin.command: systemctl is-active winter-agent
  register: agent_active
  changed_when: false
  failed_when: agent_active.stdout | trim != 'active'
  when: agent_cert_local.stat.exists
  tags: [agent, scale-out]

- name: Report enrollment state
  ansible.builtin.debug:
    msg:
      - "Node {{ agent.node_id }} → {{ agent.server_address }}; CSR at {{ agent.cert.dir }}/{{ agent.cert.csr }}"
      - "Certificate issued: {{ agent_cert_local.stat.exists }}; service starts automatically once it is"
  tags: [agent, scale-out]
