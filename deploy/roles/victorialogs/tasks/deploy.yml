---
# victorialogs component (standalone role, ADR-59). Config lives in victoriametrics.components.victorialogs.
- name: Deploy victorialogs | Resolve component config
  ansible.builtin.set_fact:
    comp_key: victorialogs
    comp: "{{ victoriametrics.components.victorialogs }}"

- name: Deploy victorialogs | Assert enabled
  ansible.builtin.assert:
    that: comp.enabled | bool
    fail_msg: "victoriametrics.components.victorialogs.enabled is false"
    quiet: true
  tags: [victorialogs]

- name: Deploy victorialogs | Ensure service account and directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0750"
  loop:
    - "{{ victoriametrics.data_dir }}"
    - "{{ victoriametrics.config_dir }}"
    - "{{ victoriametrics.config_dir }}/rules"
    - /var/tmp/winter-observability/victorialogs
  tags: [victorialogs]

- name: Deploy victorialogs | Fetch tarball
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ victoriametrics.tarball_subdir }}/{{ comp.tarball }}"
    dest: "/var/tmp/winter-observability/{{ comp.tarball }}"
    mode: "0644"
    timeout: 180
  tags: [victorialogs]

- name: Deploy victorialogs | Extract binary
  ansible.builtin.unarchive:
    src: "/var/tmp/winter-observability/{{ comp.tarball }}"
    dest: /var/tmp/winter-observability/victorialogs
    remote_src: true
    creates: "/var/tmp/winter-observability/victorialogs/.unpacked-{{ comp.tarball }}"
  tags: [victorialogs]

- name: Deploy victorialogs | Mark extracted
  ansible.builtin.copy:
    content: "{{ comp.tarball }}\n"
    dest: "/var/tmp/winter-observability/victorialogs/.unpacked-{{ comp.tarball }}"
    mode: "0644"
  tags: [victorialogs]

- name: Deploy victorialogs | Install binary if changed
  ansible.builtin.shell: |
    set -euo pipefail
    src=$(find /var/tmp/winter-observability/victorialogs -type f -name '{{ comp.binary }}' -print -quit)
    test -n "$src"
    dst="{{ victoriametrics.bin_dir }}/{{ comp.binary }}"
    if [ ! -x "$dst" ] || ! cmp -s "$src" "$dst"; then
      install -m 0755 "$src" "$dst"
      echo installed
    else
      echo unchanged
    fi
  args:
    executable: /bin/bash
  register: victorialogs_install
  changed_when: "'installed' in victorialogs_install.stdout"
  tags: [victorialogs]

- name: Deploy victorialogs | Render systemd unit
  ansible.builtin.template:
    src: unit.service.j2
    dest: /etc/systemd/system/winter-victorialogs.service
    mode: "0644"
    backup: true
  notify: restart victorialogs
  tags: [victorialogs]

- name: Deploy victorialogs | Apply handlers
  ansible.builtin.meta: flush_handlers
  tags: [victorialogs]

- name: Deploy victorialogs | Start and enable
  ansible.builtin.systemd:
    name: winter-victorialogs
    state: started
    enabled: true
    daemon_reload: true
  tags: [victorialogs]

- name: Deploy victorialogs | Wait for health
  ansible.builtin.uri:
    url: "http://{{ victoriametrics.listen_addr }}:{{ comp.port }}{{ comp.health_path }}"
    status_code: 200
  register: victorialogs_health
  until: victorialogs_health.status is defined and victorialogs_health.status == 200
  retries: "{{ victoriametrics_health_retries | int }}"
  delay: "{{ victoriametrics_health_delay | int }}"
  tags: [victorialogs]
