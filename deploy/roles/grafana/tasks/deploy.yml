---
# grafana component (standalone role, ADR-59). Config lives in victoriametrics.components.grafana.
- name: Deploy grafana | Resolve component config
  ansible.builtin.set_fact:
    comp_key: grafana
    comp: "{{ victoriametrics.components.grafana }}"

- name: Deploy grafana | Assert enabled
  ansible.builtin.assert:
    that: comp.enabled | bool
    fail_msg: "victoriametrics.components.grafana.enabled is false"
    quiet: true
  tags: [grafana]

- name: Deploy grafana | Ensure service account and directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0750"
  loop:
    - "{{ victoriametrics.data_dir }}"
    - "{{ victoriametrics.config_dir }}"
    - "{{ victoriametrics.config_dir }}/rules"
    - /var/tmp/winter-observability/grafana
  tags: [grafana]

- name: Deploy grafana | Fetch tarball
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ victoriametrics.tarball_subdir }}/{{ comp.tarball }}"
    dest: "/var/tmp/winter-observability/{{ comp.tarball }}"
    mode: "0644"
    timeout: 180
  tags: [grafana]

- name: Deploy grafana | Install directory
  ansible.builtin.unarchive:
    src: "/var/tmp/winter-observability/{{ comp.tarball }}"
    dest: "{{ comp.install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ comp.install_dir }}/bin/grafana"
  tags: [grafana]

- name: Deploy grafana | Render config
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ victoriametrics.config_dir }}/grafana.ini"
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0640"
    backup: true
  notify: restart grafana
  tags: [grafana]

- name: Deploy grafana | Render datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ victoriametrics.config_dir }}/grafana/provisioning/datasources/victoriametrics.yml"
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0640"
    backup: true
  notify: restart grafana
  tags: [grafana]

- name: Deploy grafana | Render systemd unit
  ansible.builtin.template:
    src: unit.service.j2
    dest: /etc/systemd/system/winter-grafana.service
    mode: "0644"
    backup: true
  notify: restart grafana
  tags: [grafana]

- name: Deploy grafana | Apply handlers
  ansible.builtin.meta: flush_handlers
  tags: [grafana]

- name: Deploy grafana | Start and enable
  ansible.builtin.systemd:
    name: winter-grafana
    state: started
    enabled: true
    daemon_reload: true
  tags: [grafana]

- name: Deploy grafana | Wait for health
  ansible.builtin.uri:
    url: "http://{{ victoriametrics.listen_addr }}:{{ comp.port }}{{ comp.health_path }}"
    status_code: 200
  register: grafana_health
  until: grafana_health.status is defined and grafana_health.status == 200
  retries: "{{ victoriametrics_health_retries | int }}"
  delay: "{{ victoriametrics_health_delay | int }}"
  tags: [grafana]
