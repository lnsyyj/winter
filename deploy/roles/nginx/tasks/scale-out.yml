---
# ADR-44 (Plan X): migrated verbatim from roles/observability-scale-out/tasks/nginx.yml.
# Observability scale-out (migrated from observability-scale-out.yml, ADR-43).
# Play 2: Update the Nginx Grafana upstream with all monitor nodes (hosts: etcd)

# ---- pre_tasks ----
- name: Compute Grafana upstream addresses
  ansible.builtin.set_fact:
    monitor_grafana_upstreams: >-
      {{ groups['victoriametrics'] | difference(monitoring_scale.removed_nodes | default([]))
         | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
  tags: [observability-scale-out]


# ---- post_tasks ----
- name: Print access summary
  ansible.builtin.debug:
    msg:
      - "Grafana is reachable at https://{{ nginx.server_name }}/grafana/ via {{ monitor_grafana_upstreams | length }} replica(s)"
  tags: [observability-scale-out]

# ---- roles ----
- name: Apply role nginx
  ansible.builtin.include_role:
    name: nginx
  tags: [observability-scale-out]
