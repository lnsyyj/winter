---
# destroy · remove the platform from management nodes, preserving data by default (ADR-17).

- name: Validate destroy options
  ansible.builtin.assert:
    that:
      - not (uninstall.purge_data | bool) or (uninstall.data_dirs | default([]) | length > 0)
    fail_msg: "uninstall.purge_data=true requires a non-empty uninstall.data_dirs list; platform data is never removed implicitly"
    quiet: true
  tags: [destroy]

- name: Discover installed platform units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop: "{{ uninstall.services }}"
  register: uninstall_units
  tags: [destroy]

- name: Stop and disable platform services
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ uninstall_units.results | selectattr('stat.exists') | list }}"
  tags: [destroy]

- name: Remove systemd units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ uninstall.unit_paths }}"
  tags: [destroy]

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [destroy]

- name: Remove platform configuration and binaries
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ uninstall.file_paths }}"
  tags: [destroy]

- name: Reload Nginx after removing site fragments
  # Failure here does not block uninstall: Nginx may already be stopped or removed by the site owner.
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  failed_when: false
  tags: [destroy]

- name: Remove internal repo firewall rule
  ansible.builtin.shell: |
    set -euo pipefail
    rule='rule family=ipv4 source address={{ uninstall.firewall.cidr }} port port={{ uninstall.firewall.port }} protocol=tcp accept'
    if firewall-cmd --permanent --query-rich-rule="$rule" >/dev/null 2>&1; then
      firewall-cmd --permanent --remove-rich-rule="$rule" >/dev/null
      firewall-cmd --reload >/dev/null
      echo removed
    else
      echo unchanged
    fi
  args:
    executable: /bin/bash
  register: uninstall_fw
  changed_when: "'removed' in uninstall_fw.stdout"
  failed_when: false
  when: uninstall.firewall.remove_rule | bool
  tags: [destroy]

- name: Remove service accounts (opt-in)
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
  loop: "{{ uninstall.users }}"
  when: uninstall.remove_users | bool
  tags: [destroy]

- name: Purge explicitly listed data directories (opt-in)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ uninstall.data_dirs }}"
  when: uninstall.purge_data | bool
  tags: [destroy]

- name: Report destroy result
  ansible.builtin.debug:
    msg:
      - "Platform components removed from {{ inventory_hostname }}; data preserved"
      - "Data purge: {{ uninstall.purge_data | bool }}; service accounts removed: {{ uninstall.remove_users | bool }}"
  tags: [destroy]
