---
# ADR-44 (Plan X): migrated verbatim from roles/destroy/tasks/management.yml.
# Platform uninstall (migrated from destroy.yml, ADR-43). Split per host group; data preserved by default.
# Play 1: Uninstall platform components from management nodes (hosts: etcd)

# ---- pre_tasks ----


# ---- roles ----
- name: Apply role uninstall
  ansible.builtin.include_role:
    name: uninstall
  # `uninstall` defaults load only when the role runs, so cannot be used in this include's when.
  # Default true matches uninstall_defaults.enabled; callers disable via uninstall_overrides.
  when: uninstall_overrides.enabled | default(true) | bool
  tags: [destroy]
