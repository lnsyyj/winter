---
# 制品可达性只在阶段 C1（起内网源）之后才有意义，因此默认关闭。
# 打开方式：group_vars 里 prechecks.check_artifacts: true，并填 platform.repo_base_url / registry_host。
- name: 预检 | 内网源 repodata
  ansible.builtin.uri:
    url: "{{ platform.repo_base_url }}repodata/repomd.xml"
    method: GET
    status_code: 200
    # 只探测可达性，不做证书校验；repodata 的完整性由 repomd.xml.asc（ADR-15）保证
    validate_certs: false
    timeout: 10
  register: prechecks_repo
  changed_when: false
  failed_when: false
  when:
    - prechecks.check_artifacts | bool
    - (platform.repo_base_url | default('')) | length > 0

- name: 预检 | 内网源可达性校验
  ansible.builtin.assert:
    that:
      - prechecks_repo.status | default(0) == 200
    fail_msg: >-
      内网源不可达：{{ platform.repo_base_url }}repodata/repomd.xml
      （status={{ prechecks_repo.status | default('n/a') }}，msg={{ prechecks_repo.msg | default('') }}）。
      先完成阶段 C1 起 Nginx 源，再确认节点到源网段放行、且节点没有配置全局代理（ADR-15）。
    success_msg: "内网源可达"
    quiet: true
  when:
    - prechecks.check_artifacts | bool
    - (platform.repo_base_url | default('')) | length > 0

- name: 预检 | Harbor 探测
  ansible.builtin.uri:
    url: "https://{{ platform.registry_host }}/v2/"
    method: GET
    # 401 = 需要认证，说明 registry 活着；200 = 匿名可读
    status_code: [200, 401]
    validate_certs: false
    timeout: 10
  register: prechecks_registry
  changed_when: false
  failed_when: false
  when:
    - prechecks.check_artifacts | bool
    - (platform.registry_host | default('')) | length > 0

- name: 预检 | Harbor 可达性校验
  ansible.builtin.assert:
    that:
      - prechecks_registry.status | default(0) in [200, 401]
    fail_msg: >-
      Harbor 不可达：https://{{ platform.registry_host }}/v2/
      （status={{ prechecks_registry.status | default('n/a') }}，msg={{ prechecks_registry.msg | default('') }}）。
      确认 Harbor 已启动、443 放行；此处只探测可达性，证书信任在 C4 由 ansible 下发 CA 后验证。
    success_msg: "Harbor 可达"
    quiet: true
  when:
    - prechecks.check_artifacts | bool
    - (platform.registry_host | default('')) | length > 0
