---
# 内核参数由 bootstrap-servers 阶段写入（尚未实现），因此默认只报告。
# M0 手工阶段请按提示自行确认；正式交付时把 prechecks.enforce_kernel 设为 true。
- name: 预检 | 读取内核参数
  ansible.builtin.command: sysctl -n vm.overcommit_memory vm.max_map_count
  register: prechecks_sysctl
  changed_when: false
  failed_when: false

- name: 预检 | 内核参数报告
  ansible.builtin.debug:
    msg: >-
      内核参数：vm.overcommit_memory={{ (prechecks_sysctl.stdout_lines | default(['?']))[0] }}，
      vm.max_map_count={{ (prechecks_sysctl.stdout_lines | default(['?', '?']))[1] }}。
      建议 overcommit_memory=1（RabbitMQ 与 Harbor 内置 Redis 需要）、max_map_count≥262144。
    verbosity: 0

- name: 预检 | 内核参数强制校验
  ansible.builtin.assert:
    that:
      - (prechecks_sysctl.stdout_lines | default(['0']))[0] == '1'
      - (prechecks_sysctl.stdout_lines | default(['0', '0']))[1] | int >= 262144
    fail_msg: >-
      内核参数不满足：需 vm.overcommit_memory=1 且 vm.max_map_count≥262144。
      临时：sysctl -w vm.overcommit_memory=1 vm.max_map_count=262144
      永久：写入 /etc/sysctl.d/99-winter.conf 后执行 sysctl --system
    success_msg: "内核参数符合要求"
  when: prechecks.enforce_kernel | bool
