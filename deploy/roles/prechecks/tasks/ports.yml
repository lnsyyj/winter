---
# Before deployment, the external ports on the management node must be free, otherwise the deploy phase will conflict.
- name: Precheck | Read listening ports
  ansible.builtin.command: ss -H -ltn
  register: prechecks_ss
  changed_when: false
  failed_when: false
  when: "'management' in group_names"

- name: Precheck | Management plane ports free
  ansible.builtin.assert:
    that:
      - "prechecks_ss.stdout is not search(':' ~ (item | string) ~ '\\s')"
    fail_msg: >-
      Port {{ item }} is already in use. Find the listener: ss -ltnp 'sport = :{{ item }}'.
      Common causes: an existing nginx/httpd, leftover instances from a previous platform version, or reuse by another service.
      The port must be free before deployment, otherwise startup fails and the error points to downstream components.
    success_msg: "Port {{ item }} available"
    quiet: true
  loop: "{{ prechecks.required_free_ports }}"
  when: "'management' in group_names"
