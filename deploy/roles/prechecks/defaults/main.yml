---
# Role defaults. Lower priority than group_vars/all.yml (the latter replaces the entire dict of the same name),
# here only so the role can run standalone without group_vars.
prechecks:
  management_min_vcpus: 15
  management_min_memory_mb: 24576
  management_min_root_free_gb: 350
  strict_resources: true
  strict_ports: true
  ceph_node_min_data_disks: 3
  strict_data_disks: false
  enforce_kernel: false
  max_clock_offset_seconds: 1.0
  required_hosts: []
  required_free_ports:
    - 80
    - 443
  check_artifacts: false

platform:
  repo_base_url: ""
  registry_host: ""
  registry_ca_path: ""
