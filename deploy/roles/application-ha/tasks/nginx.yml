---
# Application HA convergence (migrated from application-ha.yml, ADR-43). Split per host group; site.yml attaches each slice via tasks_from.
# Play 3: Configure the Nginx real servers behind the LVS VIP (hosts: nginx)

# ---- pre_tasks ----
- name: Load deployment passwords
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../passwords.yml"
  failed_when: false
  no_log: true
  tags: [application-ha]

- name: Confirm this is a supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "RedHat"
    fail_msg: "Only RHEL family distributions are supported; actual: {{ ansible_facts.distribution }}"
    quiet: true
  tags: [application-ha]

# The Nginx template selects `upstream winter_api` only when server_upstreams is set.
# Compute it here (before the nginx role runs) so the reverse proxy targets the Server
# replicas instead of falling back to 127.0.0.1:8081, which is wrong in HA mode where
# each Server replica binds to its own internal address.
- name: Compute Server and Harbor upstream addresses for the Nginx site
  ansible.builtin.set_fact:
    server_upstreams: "{{ groups['winter-server'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
    harbor_upstreams: "{{ groups['harbor'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
  tags: [application-ha]


# ---- roles ----
- name: Apply role realserver
  ansible.builtin.include_role:
    name: realserver
  when: ha.lvs.enabled | bool
  tags: [application-ha]
- name: Apply role nginx
  ansible.builtin.include_role:
    name: nginx
  tags: [application-ha]
