---
# Restart only on config or unit changes; notify names are generated from the component key in the unit rendering task
- name: restart victoriametrics
  ansible.builtin.systemd:
    name: winter-victoriametrics
    state: restarted
    daemon_reload: true

- name: restart vmalert
  ansible.builtin.systemd:
    name: winter-vmalert
    state: restarted
    daemon_reload: true

- name: restart victorialogs
  ansible.builtin.systemd:
    name: winter-victorialogs
    state: restarted
    daemon_reload: true

- name: restart alertmanager
  ansible.builtin.systemd:
    name: winter-alertmanager
    state: restarted
    daemon_reload: true

- name: restart grafana
  ansible.builtin.systemd:
    name: winter-grafana
    state: restarted
    daemon_reload: true
