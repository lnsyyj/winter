---
# Observability stack (ADR-18): fetch static binaries from internal repo → install → configure → systemd → health check
#
# Idempotency key points:
#   1. Extraction marker includes the tarball name; changing version auto re-extracts, rerunning the same version does not extract;
#   2. Compare with cmp before installing binaries; do not overwrite if content is unchanged (no changed);
#   3. Only config/unit changes trigger a restart via handler.
# All ports, versions and command-line arguments come from group_vars/all.yml; this file does not hardcode.

- name: Validate Grafana admin password (do not generate a default weak password)
  ansible.builtin.assert:
    that:
      - vault_grafana_admin_password is defined and vault_grafana_admin_password | length > 0
    fail_msg: "deploy/group_vars/all.yml is missing vault_grafana_admin_password, see group_vars/all.yml.example"
    quiet: true
  when: victoriametrics.components.grafana.enabled | bool
  tags: [victoriametrics]

- name: Compute enabled components
  # ADR-59: each monitoring software has its own role. This role deploys only
  # VictoriaMetrics itself; vmalert/victorialogs/alertmanager/grafana have their own roles.
  ansible.builtin.set_fact:
    victoriametrics_components: "{{ [{'key': 'victoriametrics', 'value': victoriametrics.components.victoriametrics}] if victoriametrics.components.victoriametrics.enabled | bool else [] }}"
  tags: [victoriametrics]

- name: Create service account (non-root)
  ansible.builtin.user:
    name: "{{ victoriametrics.run_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
  tags: [victoriametrics]

- name: Make the shared /etc/winter parent traversable by all winter service accounts
  # Multiple service accounts share /etc/winter (winter-server, winter-monitor, ...).
  # If a sibling role created it 0750 for another account, this account cannot reach its own config dir.
  # Keep ownership as-is; only relax the traversal bit. Config files stay 0640 and owner-restricted.
  ansible.builtin.file:
    path: "{{ victoriametrics.config_dir | dirname }}"
    state: directory
    mode: "0755"
  tags: [victoriametrics]

- name: Create data / config / rules / staging directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0750"
  loop:
    - "{{ victoriametrics.data_dir }}"
    - "{{ victoriametrics.config_dir }}"
    - "{{ victoriametrics.config_dir }}/rules"
    - "{{ victoriametrics.config_dir }}/grafana/provisioning/datasources"
    - "{{ victoriametrics.data_dir }}/grafana"
    - "{{ victoriametrics.data_dir }}/grafana/log"
    - /var/tmp/winter-observability
    - /opt/winter
    - "{{ victoriametrics.components.grafana.install_dir }}"
  tags: [victoriametrics]

- name: Create extraction directory for each component
  ansible.builtin.file:
    path: "/var/tmp/winter-observability/{{ item.key }}"
    state: directory
    mode: "0755"
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [victoriametrics]

- name: Fetch static packages from internal repo (ADR-15 install channel)
  ansible.builtin.get_url:
    url: "{{ platform.repo_base_url }}/{{ victoriametrics.tarball_subdir }}/{{ item.value.tarball }}"
    dest: "/var/tmp/winter-observability/{{ item.value.tarball }}"
    mode: "0644"
    timeout: 180
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [victoriametrics]

- name: Extract single-file binary components
  ansible.builtin.unarchive:
    src: "/var/tmp/winter-observability/{{ item.value.tarball }}"
    dest: "/var/tmp/winter-observability/{{ item.key }}"
    remote_src: true
    creates: "/var/tmp/winter-observability/{{ item.key }}/.unpacked-{{ item.value.tarball }}"
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.mode | default('binary') == 'binary'
  tags: [victoriametrics]

- name: Mark as extracted (marker changes with tarball version)
  ansible.builtin.copy:
    content: "{{ item.value.tarball }}\n"
    dest: "/var/tmp/winter-observability/{{ item.key }}/.unpacked-{{ item.value.tarball }}"
    mode: "0644"
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.mode | default('binary') == 'binary'
  tags: [victoriametrics]

- name: Install single-file binaries (do not overwrite if unchanged)
  ansible.builtin.shell: |
    set -euo pipefail
    src=$(find "/var/tmp/winter-observability/{{ item.key }}" -type f -name "{{ item.value.binary }}" -print -quit)
    test -n "$src"
    dst="{{ victoriametrics.bin_dir }}/{{ item.value.binary }}"
    if [ ! -x "$dst" ] || ! cmp -s "$src" "$dst"; then
      install -m 0755 "$src" "$dst"
      echo installed
    else
      echo unchanged
    fi
  args:
    executable: /bin/bash
  register: victoriametrics_install
  changed_when: "'installed' in victoriametrics_install.stdout"
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.mode | default('binary') == 'binary'
  tags: [victoriametrics]

- name: Install Grafana directory (includes frontend static assets, needs the whole directory)
  ansible.builtin.unarchive:
    src: "/var/tmp/winter-observability/{{ victoriametrics.components.grafana.tarball }}"
    dest: "{{ victoriametrics.components.grafana.install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ victoriametrics.components.grafana.install_dir }}/bin/grafana"
  when: victoriametrics.components.grafana.enabled | bool
  tags: [victoriametrics, grafana]

- name: Render Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ victoriametrics.config_dir }}/alertmanager.yml"
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0640"
    backup: true
  notify: restart alertmanager
  tags: [victoriametrics]

- name: Render vmalert rules (M0 placeholder)
  ansible.builtin.template:
    src: rules.yml.j2
    dest: "{{ victoriametrics.config_dir }}/rules/platform.yml"
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0640"
    backup: true
  notify: restart vmalert
  tags: [victoriametrics]

- name: Render Grafana configuration (includes admin password, mode 0640)
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ victoriametrics.config_dir }}/grafana.ini"
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0640"
    backup: true
  notify: restart grafana
  when: victoriametrics.components.grafana.enabled | bool
  tags: [victoriametrics, grafana]

- name: Render default datasource (VictoriaMetrics)
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ victoriametrics.config_dir }}/grafana/provisioning/datasources/victoriametrics.yml"
    owner: "{{ victoriametrics.run_user }}"
    group: "{{ victoriametrics.run_user }}"
    mode: "0640"
    backup: true
  notify: restart grafana
  when: victoriametrics.components.grafana.enabled | bool
  tags: [victoriametrics, grafana]

- name: Render systemd unit
  ansible.builtin.template:
    src: unit.service.j2
    dest: "/etc/systemd/system/winter-{{ item.key }}.service"
    mode: "0644"
    backup: true
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    comp_key: "{{ item.key }}"
    comp: "{{ item.value }}"
  notify: "restart {{ item.key }}"
  tags: [victoriametrics]

- name: Apply configuration changes (restart first)
  ansible.builtin.meta: flush_handlers
  tags: [victoriametrics]

- name: Start and enable on boot
  ansible.builtin.systemd:
    name: "winter-{{ item.key }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [victoriametrics]

- name: Wait for components to be healthy
  ansible.builtin.uri:
    url: "http://{{ victoriametrics.listen_addr }}:{{ item.value.port }}{{ item.value.health_path }}"
    status_code: 200
    return_content: false
  register: victoriametrics_health
  until: victoriametrics_health.status is defined and victoriametrics_health.status == 200
  retries: "{{ victoriametrics_health_retries | int }}"
  delay: "{{ victoriametrics_health_delay | int }}"
  loop: "{{ victoriametrics_components }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [victoriametrics]

- name: Print summary
  ansible.builtin.debug:
    msg:
      - "Observability stack: {{ victoriametrics_components | map(attribute='key') | join(', ') }}"
      - "All listen only on {{ victoriametrics.listen_addr }}; Grafana external entry point https://{{ platform.domain }}/grafana/"
      - "Metrics/logs retained for {{ victoriametrics.retention_days }} days; single alert pipeline (vmalert → Alertmanager)"
  tags: [victoriametrics]
