---
# ADR-44 (Plan X): migrated verbatim from roles/observability-scale-in/tasks/monitor.yml.
# Observability scale-in (migrated from observability-scale-in.yml, ADR-43).
# Play 2: Rewire remaining monitor nodes and drop removed peers (hosts: victoriametrics)

# ---- pre_tasks ----

- name: Restore localhost binding when a single monitor node remains
  ansible.builtin.set_fact:
    victoriametrics_bind_addr: >-
      {{ '0.0.0.0' if ((groups['victoriametrics'] | length - victoriametrics_scale.removed_nodes | default([]) | length) > 1)
         else victoriametrics_listen_addr }}
    victoriametrics_advertise_addr: >-
      {{ (ansible_host | default(victoriametrics_listen_addr)) if ((groups['victoriametrics'] | length - victoriametrics_scale.removed_nodes | default([]) | length) > 1)
         else victoriametrics_listen_addr }}
  tags: [observability-scale-in]

- name: Compute remaining monitor peer addresses
  ansible.builtin.set_fact:
    monitor_peers: >-
      {{ groups['victoriametrics'] | difference(victoriametrics_scale.removed_nodes | default([]))
         | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
  tags: [observability-scale-in]

- name: Recompute metrics query endpoint
  ansible.builtin.set_fact:
    victoriametrics_metrics_url: >-
      {{ victoriametrics_scale.metrics_query_url if (victoriametrics_scale.metrics_query_url | default('') | length > 0)
         else (hostvars[(groups['victoriametrics'] | difference(victoriametrics_scale.removed_nodes | default([])) | first)]['ansible_host']
               | default(victoriametrics_listen_addr)) }}
  tags: [observability-scale-in]

- name: Compute the Server endpoint used by the Alertmanager webhook
  ansible.builtin.set_fact:
    victoriametrics_server_url: >-
      {{ hostvars[groups['etcd'] | first]['ansible_host'] | default(victoriametrics_listen_addr) }}
  tags: [observability-scale-in]

- name: Point vmalert only at remaining Alertmanager replicas
  ansible.builtin.set_fact:
    victoriametrics_vmalert_notifiers: >-
      {{ groups['victoriametrics'] | difference(victoriametrics_scale.removed_nodes | default([]))
         | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
  tags: [observability-scale-in]


# ---- roles ----
- name: Apply role victoriametrics
  ansible.builtin.include_role:
    name: victoriametrics
  when: inventory_hostname not in (victoriametrics_scale.removed_nodes | default([]))
  tags: [observability-scale-in]
