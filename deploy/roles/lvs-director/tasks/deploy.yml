---
# LVS Director role (ADR-46): runs on hosts with lvs_role=director in the inventory.
# RealServer addresses are discovered from hostvars (lvs_role=realserver), not from [nginx],
# so one unified inventory needs no keepalived/nginx group split.
- name: Discover LVS RealServer addresses from inventory lvs_role
  ansible.builtin.set_fact:
    lvs_realservers: >-
      {{ groups['management'] | default([])
         | select('in', (groups['management'] | default([])))
         | map('extract', hostvars) | selectattr('lvs_role', 'defined')
         | selectattr('lvs_role', 'equalto', 'realserver')
         | map(attribute='ansible_host') | list }}
  run_once: true
  tags: [lvs, lvs-director]

- name: Discover LVS Directors and VRRP peers from inventory lvs_role
  ansible.builtin.set_fact:
    lvs_directors: "{{ groups['management'] | default([]) | map('extract', hostvars)
      | selectattr('lvs_role', 'defined') | selectattr('lvs_role', 'equalto', 'director')
      | map(attribute='ansible_host') | list }}"
    ha_peer_addresses: "{{ groups['management'] | default([]) | map('extract', hostvars)
      | selectattr('lvs_role', 'defined') | selectattr('lvs_role', 'equalto', 'director')
      | map(attribute='ansible_host') | reject('equalto', ansible_host) | list }}"
  run_once: true
  tags: [lvs, lvs-director]

- name: Fail if fewer than two RealServers are configured
  ansible.builtin.assert:
    that: lvs_realservers | length >= 2
    fail_msg: "LVS/DR needs >=2 hosts with lvs_role=realserver in inventory/hosts.ini"
    quiet: true
  run_once: true
  tags: [lvs, lvs-director]

- name: Inject discovered RealServers into the Keepalived LVS config
  ansible.builtin.set_fact:
    ha: "{{ ha | combine({'lvs': ha.lvs | combine({'real_servers': lvs_realservers})}) }}"
  run_once: true
  tags: [lvs, lvs-director]

# Keepalived VRRP on the [keepalived] nodes: a floating VIP fronts the Nginx replicas (ADR-16).
# A failed Nginx health check releases the VIP so the peer can take over.

- name: Validate Keepalived configuration
  ansible.builtin.assert:
    that:
      - ha.enabled | bool
      - (ha.vips | default([]) | length > 0) or (ha.vip | default('') | length > 0)
      - vault_keepalived_auth_pass is defined and vault_keepalived_auth_pass | length > 0
    fail_msg: "ha.enabled=true requires ha.vip or ha.vips, plus vault_keepalived_auth_pass (see group_vars/all.yml.example)"
    quiet: true
  tags: [ha, keepalived]

- name: Validate LVS load balancing configuration
  ansible.builtin.assert:
    that:
      - lvs_realservers | length >= 2
      - (ha.vips | default([]) | length > 0) or (ha.vip | default('') | length > 0)
    fail_msg: "LVS/DR requires at least two RealServers (lvs_role=realserver) and ha.vip"
    quiet: true
  when: ha.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

# modprobe was removed from ansible-core; use command guarded by a /sys/module check.
- name: Check whether ip_vs is loaded
  ansible.builtin.stat:
    path: /sys/module/ip_vs
  register: keepalived_ip_vs_loaded
  changed_when: false
  when: ha.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Load the ip_vs kernel module
  ansible.builtin.command: modprobe ip_vs
  when:
    - ha.lvs.enabled | default(false) | bool
    - not keepalived_ip_vs_loaded.stat.exists
  tags: [ha, keepalived, lvs]

- name: Check whether keepalived is installed
  ansible.builtin.stat:
    path: /usr/sbin/keepalived
  register: keepalived_bin
  tags: [ha, keepalived]

- name: Install keepalived (only if missing)
  ansible.builtin.dnf:
    name: keepalived
    state: present
    disablerepo: "pgdg*"
  when: not keepalived_bin.stat.exists
  tags: [ha, keepalived]

- name: Create keepalived configuration directory
  ansible.builtin.file:
    path: /etc/keepalived
    state: directory
    mode: "0755"
  tags: [ha, keepalived]

- name: Install the Nginx health-check script
  ansible.builtin.template:
    src: check_nginx.sh.j2
    dest: "{{ keepalived_check_script }}"
    mode: "0755"
  notify: restart keepalived
  tags: [ha, keepalived]

- name: Install the LVS health-check script
  ansible.builtin.template:
    src: check_lvs.sh.j2
    dest: "{{ keepalived_lvs_check_script }}"
    mode: "0755"
  notify: restart keepalived
  when: ha.lvs.enabled | default(false) | bool
  tags: [ha, keepalived, lvs]

- name: Render keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_config_path }}"
    mode: "0644"
    backup: true
  notify: restart keepalived
  tags: [ha, keepalived]

- name: Apply configuration changes
  ansible.builtin.meta: flush_handlers
  tags: [ha, keepalived]

- name: Start and enable keepalived
  ansible.builtin.systemd:
    name: "{{ keepalived_service }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [ha, keepalived]

- name: Print Keepalived summary
  ansible.builtin.debug:
    msg:
      - "Keepalived VIPs: {{ ((ha.vips | default([]) | length > 0) | ternary(ha.vips, [ha.vip])) | join(', ') }} on {{ ha.interface }}"
      - "The VIP is released when the local health check fails"
  tags: [ha, keepalived]
