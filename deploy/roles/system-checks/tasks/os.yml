---
- name: Precheck | Read /etc/os-release
  ansible.builtin.slurp:
    src: /etc/os-release
  register: prechecks_os_release
  changed_when: false

- name: Precheck | Parse os-release
  ansible.builtin.set_fact:
    prechecks_os_release_text: "{{ prechecks_os_release.content | b64decode }}"
    prechecks_os_pretty: >-
      {{ (prechecks_os_release.content | b64decode).splitlines()
         | select('match', '^PRETTY_NAME=') | list | first | default('unknown')
         | replace('PRETTY_NAME=', '') | replace('"', '') }}

- name: Precheck | Resolve supported OS baselines
  # Support multiple OS baselines via a configurable whitelist (ADR-57).
  # Each entry may specify: distribution, major_version, optional pretty_name_contains.
  # A host passes when it matches ANY entry. Empty whitelist = skip the check.
  ansible.builtin.set_fact:
    prechecks_os_matches: >-
      {{ prechecks_supported_os | default([])
         | selectattr('distribution', 'defined')
         | selectattr('distribution', 'equalto', ansible_facts.distribution)
         | selectattr('major_version', 'defined')
         | selectattr('major_version', 'equalto', ansible_facts.distribution_major_version | string)
         | rejectattr('pretty_name_contains', 'defined')
         | list }}

- name: Precheck | Resolve OS baselines with pretty-name narrowing
  ansible.builtin.set_fact:
    prechecks_os_matches: >-
      {{ (prechecks_os_matches | default([])) +
         (prechecks_supported_os | default([])
          | selectattr('distribution', 'defined')
          | selectattr('distribution', 'equalto', ansible_facts.distribution)
          | selectattr('major_version', 'defined')
          | selectattr('major_version', 'equalto', ansible_facts.distribution_major_version | string)
          | selectattr('pretty_name_contains', 'defined')
          | selectattr('pretty_name_contains', 'in', prechecks_os_release_text)
          | list) }}

- name: Precheck | Verify OS baseline
  ansible.builtin.assert:
    that:
      - (prechecks_supported_os | length) == 0 or (prechecks_os_matches | default([]) | length) > 0
    fail_msg: >-
      OS baseline: expected
      {{ prechecks_supported_os | map(attribute='distribution') | join('/') }}
      {{ prechecks_supported_os | map(attribute='major_version') | unique | join('/') }},
      got {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}
      (PRETTY_NAME={{ prechecks_os_pretty }}).
      Fix: add an entry to prechecks_supported_os_defaults after the new baseline is approved (ADR-57).
    success_msg: >-
      OS baseline OK: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      (matched {{ (prechecks_os_matches | default([])) | length }} whitelist entry/entries)
    quiet: true
  when: (prechecks_supported_os | length) > 0
