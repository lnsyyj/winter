---
# Clock drift causes cephadm to fail immediately (manual §5.0), so this check must be strictly enforced.
- name: Precheck | Read chrony status
  ansible.builtin.command: chronyc tracking
  register: prechecks_chrony
  changed_when: false
  failed_when: false

- name: Precheck | Calculate clock offset
  ansible.builtin.set_fact:
    prechecks_clock_offset: >-
      {{ ((prechecks_chrony.stdout_lines | default([]) | select('search', 'System time') | list
           | first | default('System time : 999 seconds fast')).split())[3] | default('999') }}

- name: Precheck | Time synchronization and offset
  ansible.builtin.assert:
    that:
      - prechecks_chrony.rc | default(1) == 0
      - (prechecks_clock_offset | float) <= (prechecks.max_clock_offset_seconds | float)
    fail_msg: >-
      chronyd is not ready or the offset is too large (required ≤{{ prechecks.max_clock_offset_seconds }}s,
      measured {{ prechecks_clock_offset }}s). chronyc output: {{ prechecks_chrony.stdout | default('unavailable') | trim }}.
      Fix: systemctl enable --now chronyd; confirm the NTP source is reachable; if needed, chronyc makestep.
    success_msg: "Time synchronization OK (offset {{ prechecks_clock_offset }}s)"
    quiet: true
