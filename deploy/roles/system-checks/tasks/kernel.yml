---
# Kernel parameters are written by the bootstrap-servers phase (not implemented yet), so they are reported only by default.
# In the M0 manual phase, confirm them yourself following the prompts; for production delivery, set prechecks.enforce_kernel to true.
- name: Precheck | Read kernel parameters
  ansible.builtin.command: sysctl -n vm.overcommit_memory vm.max_map_count
  register: prechecks_sysctl
  changed_when: false
  failed_when: false

- name: Precheck | Report kernel parameters
  ansible.builtin.debug:
    msg: >-
      Kernel parameters: vm.overcommit_memory={{ (prechecks_sysctl.stdout_lines | default(['?']))[0] }},
      vm.max_map_count={{ (prechecks_sysctl.stdout_lines | default(['?', '?']))[1] }}.
      Recommended: overcommit_memory=1 (required by Harbor's bundled Redis), max_map_count>=262144.
    verbosity: 0

- name: Precheck | Enforce kernel parameters
  ansible.builtin.assert:
    that:
      - (prechecks_sysctl.stdout_lines | default(['0']))[0] == '1'
      - (prechecks_sysctl.stdout_lines | default(['0', '0']))[1] | int >= 262144
    fail_msg: >-
      vm.overcommit_memory: expected 1, got {{ (prechecks_sysctl.stdout_lines | default(['?']))[0] }};
      vm.max_map_count: expected >=262144, got {{ (prechecks_sysctl.stdout_lines | default(['?', '?']))[1] }}.
      Fix: sysctl -w vm.overcommit_memory=1 vm.max_map_count=262144 now,
      and write both to /etc/sysctl.d/99-winter.conf for persistence.
    success_msg: "Kernel parameters meet requirements"
  when: prechecks.enforce_kernel | bool
