---
# ADR-64: artifact reachability is mandatory. Every configured target is checked;
# any unreachable endpoint aborts the run. Targets are configured in
# prechecks.artifact_targets (no warn-only mode).
- name: Precheck | Assert artifact targets configured
  ansible.builtin.assert:
    that:
      - (prechecks.artifact_targets | default({}) | length) > 0
    fail_msg: >-
      No artifact targets configured: expected at least one URL, got none.
      Fix: set prechecks.artifact_targets in group_vars/all.yml.
    success_msg: "Artifact targets configured"
    quiet: true

- name: Precheck | Probe artifact target
  ansible.builtin.uri:
    url: "{{ item.value }}"
    method: GET
    status_code: [200, 401]
    validate_certs: false
    timeout: 10
  register: prechecks_artifacts
  changed_when: false
  failed_when: false
  loop: "{{ prechecks.artifact_targets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Precheck | Verify artifact reachability
  ansible.builtin.assert:
    that:
      - item.status | default(0) in [200, 401]
    fail_msg: >-
      Artifact '{{ item.item.key }}' at {{ item.item.value }}:
      expected HTTP 200 or 401, got {{ item.status | default('no response') }}.
      Fix: deploy the owning component (repo-nginx / harbor) and check firewall + proxy settings.
    success_msg: "Artifact {{ item.item.key }} reachable"
    quiet: true
  loop: "{{ prechecks_artifacts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
