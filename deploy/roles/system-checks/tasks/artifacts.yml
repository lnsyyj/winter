---
# Artifact reachability is only meaningful after phase C1 (bring up the internal repo), so it is disabled by default.
# To enable: set prechecks.check_artifacts: true in group_vars and fill in platform.repo_base_url / registry_host.
- name: Precheck | Internal repo repodata
  ansible.builtin.uri:
    url: "{{ platform.repo_base_url }}repodata/repomd.xml"
    method: GET
    status_code: 200
    # Only probe reachability, skip certificate validation; repodata integrity is guaranteed by repomd.xml.asc (ADR-15)
    validate_certs: false
    timeout: 10
  register: prechecks_repo
  changed_when: false
  failed_when: false
  when:
    - prechecks.check_artifacts | bool
    - (platform.repo_base_url | default('')) | length > 0

- name: Precheck | Verify internal repo reachability
  ansible.builtin.assert:
    that:
      - prechecks_repo.status | default(0) == 200
    fail_msg: >-
      Internal repo unreachable: {{ platform.repo_base_url }}repodata/repomd.xml
      (status={{ prechecks_repo.status | default('n/a') }}, msg={{ prechecks_repo.msg | default('') }}).
      First complete phase C1 to bring up the Nginx repo, then confirm the repo subnet is allowed through the firewall on the node and that no global proxy is configured (ADR-15).
    success_msg: "Internal repo reachable"
    quiet: true
  when:
    - prechecks.check_artifacts | bool
    - (platform.repo_base_url | default('')) | length > 0

- name: Precheck | Harbor probe
  ansible.builtin.uri:
    url: "https://{{ platform.registry_host }}/v2/"
    method: GET
    # 401 = authentication required (registry is alive); 200 = anonymously readable
    status_code: [200, 401]
    validate_certs: false
    timeout: 10
  register: prechecks_registry
  changed_when: false
  failed_when: false
  when:
    - prechecks.check_artifacts | bool
    - (platform.registry_host | default('')) | length > 0

- name: Precheck | Verify Harbor reachability
  ansible.builtin.assert:
    that:
      - prechecks_registry.status | default(0) in [200, 401]
    fail_msg: >-
      Harbor unreachable: https://{{ platform.registry_host }}/v2/
      (status={{ prechecks_registry.status | default('n/a') }}, msg={{ prechecks_registry.msg | default('') }}).
      Confirm Harbor is started and 443 is allowed through the firewall; this only probes reachability — certificate trust is verified in C4 after ansible distributes the CA.
    success_msg: "Harbor reachable"
    quiet: true
  when:
    - prechecks.check_artifacts | bool
    - (platform.registry_host | default('')) | length > 0
