---
# Precheck entry point, split by category for easy troubleshooting with --tags.
# All subtasks must remain read-only (changed_when: false), otherwise the check itself becomes a change.
- name: Precheck | Group validity
  ansible.builtin.assert:
    that:
      - group_names | length > 0
      - not ('management' in group_names and 'ceph_nodes' in group_names)
    fail_msg: >-
      Host {{ inventory_hostname }} has an invalid group assignment: it must belong to either management or ceph_nodes,
      and not both (the management plane and managed node roles are mutually exclusive; for single-machine deployment, use only management).
    success_msg: "Group validation passed: {{ group_names | join(', ') }}"
    quiet: true
  tags: [prechecks, prechecks.groups]

- name: Precheck | OS baseline
  ansible.builtin.import_tasks: os.yml
  tags: [prechecks, prechecks.os]

- name: Precheck | Resources and disks
  ansible.builtin.import_tasks: resources.yml
  tags: [prechecks, prechecks.resources]

- name: Precheck | Time synchronization
  ansible.builtin.import_tasks: time.yml
  tags: [prechecks, prechecks.time]

- name: Precheck | Kernel parameters
  ansible.builtin.import_tasks: kernel.yml
  tags: [prechecks, prechecks.kernel]

- name: Precheck | Network and resolution
  ansible.builtin.import_tasks: network.yml
  tags: [prechecks, prechecks.network]

- name: Precheck | Port usage
  ansible.builtin.import_tasks: ports.yml
  tags: [prechecks, prechecks.ports]

- name: Precheck | Artifact reachability (optional)
  ansible.builtin.import_tasks: artifacts.yml
  tags: [prechecks, prechecks.artifacts]
