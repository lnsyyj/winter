---
- name: Precheck | Read default route
  ansible.builtin.command: ip -4 route show default
  register: prechecks_route
  changed_when: false
  failed_when: false

- name: Precheck | Verify default route
  ansible.builtin.assert:
    that:
      - (prechecks_route.stdout | default('')) | trim | length > 0
    fail_msg: >-
      No IPv4 default route. Managed nodes must have **outbound** access to management plane 443 and the internal repo/registry (deployment plan §2),
      otherwise the Agent cannot register and images cannot be pulled. Check the gateway and NIC configuration.
    success_msg: "Default route exists"
    quiet: true

- name: Precheck | DNS resolution
  ansible.builtin.command: "getent hosts {{ item }}"
  register: prechecks_getent
  changed_when: false
  failed_when: false
  loop: "{{ prechecks.required_hosts }}"
  when: prechecks.required_hosts | length > 0

- name: Precheck | Verify resolution results
  ansible.builtin.assert:
    that:
      - item.rc | default(1) == 0
    fail_msg: >-
      Cannot resolve {{ item.item }}. Add it to /etc/hosts or fix DNS;
      both the registry certificate and the access entry point depend on this name (ADR-16).
    success_msg: "Resolution of {{ item.item }} OK"
    quiet: true
  loop: "{{ prechecks_getent.results | default([]) }}"
  when: prechecks.required_hosts | length > 0

- name: Precheck | SELinux status (report only)
  ansible.builtin.debug:
    msg: >-
      SELinux={{ ansible_facts.selinux.status | default('unknown') }}
      ({{ ansible_facts.selinux.mode | default('-') }}).
      If enforcing, the internal repo directory needs the httpd_sys_content_t context, otherwise Nginx returns 403 (ADR-15).
