---
# Publish the local artifact repository
# Constraints: read-only directory + plaintext HTTP + restricted source subnet; no private keys/certificates
#
# The repo site is served by Nginx, which may not be present on a fresh node. Keep this role
# standalone-capable: install and start Nginx here if missing, without triggering a dnf metadata
# refresh on hosts that already have it (third-party repos such as pgdg may be unreachable).
- name: Check whether nginx is installed
  ansible.builtin.stat:
    path: /usr/sbin/nginx
  register: repo_nginx_bin
  tags: [repo]

- name: Install nginx for the local repository site (only if missing)
  ansible.builtin.dnf:
    name: nginx
    state: present
    disablerepo: "pgdg*"
  when: not repo_nginx_bin.stat.exists
  tags: [repo]

- name: Ensure semanage is available for SELinux port labeling
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
    disablerepo: "pgdg*"
  when: ansible_facts.selinux is defined and ansible_facts.selinux.status == 'enabled'
  tags: [repo]

- name: Check the current SELinux label of the repo port
  ansible.builtin.shell: "semanage port -l | grep -E '[[:space:]]{{ local-repo.listen_port }}[[:space:]]' || true"
  args:
    executable: /bin/bash
  register: repo_seport_before
  changed_when: false
  when: ansible_facts.selinux is defined and ansible_facts.selinux.status == 'enabled'
  tags: [repo]

- name: Label the repo port as http_port_t under SELinux
  # Nginx only binds ports labeled http_port_t when SELinux is enforcing; 8082 is not in the
  # default allowlist and may already be claimed by another type (e.g. us_cli_port_t).
  ansible.builtin.shell: |
    set -euo pipefail
    if semanage port -l | grep -qE '[[:space:]]{{ local-repo.listen_port }}[[:space:]]'; then
      semanage port -m -t http_port_t -p tcp {{ local-repo.listen_port }}
    else
      semanage port -a -t http_port_t -p tcp {{ local-repo.listen_port }}
    fi
  args:
    executable: /bin/bash
  when:
    - ansible_facts.selinux is defined and ansible_facts.selinux.status == 'enabled'
    - "'http_port_t' not in repo_seport_before.stdout"
  tags: [repo]

- name: Reload nginx when the SELinux port label changed
  # The label change lets a previously loaded nginx configuration finally bind the port.
  # Do not rely on the template's notify: a second run finds the file unchanged, so no reload
  # would be notified and the port would stay unbound.
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: repo_seport.changed | default(false)
  tags: [repo]

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  tags: [repo]

- name: Ensure the nginx configuration directory exists
  ansible.builtin.file:
    path: /etc/nginx/conf.d
    state: directory
    mode: "0755"
  tags: [repo]

- name: Create publish directory
  ansible.builtin.file:
    path: "{{ local-repo.root }}"
    state: directory
    mode: "0755"
  tags: [repo]

- name: Sync artifacts (rpm / tarball / pip)
  ansible.builtin.copy:
    src: "{{ local-repo.src }}/"
    dest: "{{ local-repo.root }}/"
    mode: preserve
    directory_mode: "0755"
  tags: [repo]

- name: Gather publish statistics
  ansible.builtin.shell: |
    set -o pipefail
    find {{ local-repo.root }} -type f | wc -l
    du -sh {{ local-repo.root }} | awk '{print $1}'
  args:
    executable: /bin/bash
  register: repo_stat
  changed_when: false
  tags: [repo]

- name: Install Nginx repo site
  ansible.builtin.template:
    src: repo.conf.j2
    dest: /etc/nginx/conf.d/winter-repo.conf
    mode: "0644"
    backup: true
  notify: reload nginx
  tags: [repo]

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: repo_nginx_test
  changed_when: false
  failed_when: repo_nginx_test.rc != 0
  tags: [repo]

- name: Apply changes
  ansible.builtin.meta: flush_handlers
  tags: [repo]

- name: Allow firewall port (internal subnet only)
  ansible.builtin.shell: |
    set -euo pipefail
    rule='rule family=ipv4 source address={{ local-repo.allow_cidr }} port port={{ local-repo.listen_port }} protocol=tcp accept'
    # Use --query-rich-rule to decide, rather than treating the --reload success as a change:
    # the latter would report changed on every deploy (TC-26 requires changed=0 on the second run).
    if firewall-cmd --permanent --query-rich-rule="$rule" >/dev/null 2>&1; then
      echo unchanged
    else
      firewall-cmd --permanent --add-rich-rule="$rule" >/dev/null
      firewall-cmd --reload >/dev/null
      echo added
    fi
  args:
    executable: /bin/bash
  register: repo_fw
  changed_when: "'added' in repo_fw.stdout"
  failed_when: false
  tags: [repo]

- name: Self-check (local machine)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sS --max-time 5 -o /dev/null -w "%{http_code}" "http://127.0.0.1:{{ local-repo.listen_port }}/"
  args:
    executable: /bin/bash
  register: repo_selfcheck
  changed_when: false
  failed_when: repo_selfcheck.stdout | trim != "200"
  tags: [repo]

- name: Report result
  ansible.builtin.debug:
    msg:
      - "Artifact repo: http://{{ ansible_facts.default_ipv4.address }}:{{ local-repo.listen_port }}/  (root {{ local-repo.root }})"
      - "File count {{ repo_stat.stdout_lines[0] }}, size {{ repo_stat.stdout_lines[1] }}"
      - "Only {{ local-repo.allow_cidr }} is allowed to access"
  tags: [repo]
