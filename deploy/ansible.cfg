[defaults]
inventory = inventory/all-in-one
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
forks = 10
callbacks_enabled = profile_tasks, timer

# On first connection to a new host, known_hosts verification fails. For a production delivery, run ssh-keyscan first and verify the fingerprint.
# Do not disable verification long-term (man-in-the-middle risk on par with B2). You may enable the line below temporarily for troubleshooting in the M0 self-built environment.
#host_key_checking = False

[ssh_connection]
pipelining = True
