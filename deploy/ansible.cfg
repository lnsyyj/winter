[defaults]
inventory = inventory/all-in-one
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False
forks = 10
callbacks_enabled = profile_tasks, timer
# Site.yml lists every component/operation play; tags and inventory groups select which run.
# Roles dispatch by winter_ops_action via include_tasks at runtime.
gathering = explicit
fact_caching = jsonfile
fact_caching_connection = .ansible_facts
fact_caching_timeout = 86400
# Component group names carry a hyphen (winter-server, local-repo, pg-ha). Keep them verbatim so
# groups['winter-server'] resolves as written in playbooks and templates.
force_valid_group_names = ignore

# On first connection to a new host, known_hosts verification fails. For a production delivery, run ssh-keyscan first and verify the fingerprint.
# Do not disable verification long-term (man-in-the-middle risk on par with B2). You may enable the line below temporarily for troubleshooting in the M0 self-built environment.
#host_key_checking = False

[ssh_connection]
pipelining = True
