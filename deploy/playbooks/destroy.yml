---
# destroy · uninstall the platform, preserving data by default (ADR-17 stage semantics)
#
# Usage:
#   ./deploy.sh destroy -i inventory/multinode
#   ./deploy.sh destroy -i inventory/multinode -e '{"uninstall":{"purge_data":true,"data_dirs":["/var/lib/winter/monitoring"]}}'
#
# Agents are removed in a second play. Platform data is never removed implicitly.

- name: Uninstall platform components from management nodes
  hosts: management
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords (deploy/passwords.yml, skip if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

  roles:
    - role: uninstall
      tags: [destroy]
      when: uninstall.enabled | bool

- name: Remove Agents from managed nodes
  hosts: ceph_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: agent
      tasks_from: remove
      tags: [destroy, scale-in]

  post_tasks:
    - name: Summarize destroy
      ansible.builtin.debug:
        msg:
          - "Platform and Agents removed; data volumes were preserved"
      tags: [always]
