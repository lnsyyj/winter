---
# scale-in · remove the Agent from managed nodes (ADR-35)
#
# Usage:
#   ./deploy.sh scale-in -i inventory/multinode --limit node03
#   ./deploy.sh scale-in -i inventory/multinode --limit node03 -e '{"agent":{"scale_in":{"remove_user":true}}}'
#
# Platform data is preserved by default. Remove the host from [ceph_nodes] only after this stage succeeds.

- name: Scale in managed nodes (remove Agent)
  hosts: ceph_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords (deploy/passwords.yml, skip if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Warn that scale-in is destructive for the Agent installation
      ansible.builtin.debug:
        msg: "Removing the Agent from {{ inventory_hostname }}; platform data is preserved unless scale_in.purge_data is set"
      tags: [always]

  roles:
    - role: agent
      tasks_from: remove
      tags: [agent, scale-in]

  post_tasks:
    - name: Summarize scale-in
      ansible.builtin.debug:
        msg:
          - "Agent removed from {{ inventory_hostname }}; remove the host from [ceph_nodes] when ready"
      tags: [always]
