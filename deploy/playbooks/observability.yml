---
# monitoring · Standalone observability stack stage (ADR-18 / ADR-33 / ADR-17).
# Deploys VictoriaMetrics / vmalert / VictoriaLogs / Alertmanager / Grafana from the internal repo.
# Read-only prechecks run before convergence; use --tags precheck.monitoring to run only the checks.
#
# Usage:
#   ./deploy.sh observability -i inventory/multinode
#   ./deploy.sh observability -i inventory/multinode --tags precheck.monitoring

- name: Deploy the observability stack
  hosts: observability
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Run observability prechecks
      ansible.builtin.include_role:
        name: observability
        tasks_from: prechecks
      tags: [precheck, precheck.monitoring]

  roles:
    - role: observability
      when: observability.enabled | bool
      tags: [observability, monitoring]

  post_tasks:
    - name: Summarize observability deployment
      ansible.builtin.debug:
        msg: "Observability components listen on {{ monitoring_listen_addr }}; Grafana is reachable only through the /grafana/ reverse proxy"
      tags: [always]
