---
# bootstrap-servers · base dependencies and OS settings (ADR-17 stage semantics)
#
# Must run before prechecks/deploy: installs podman/python/chrony and applies the kernel and data-disk
# settings that prechecks only reports.
#
# Usage:
#   ./deploy.sh bootstrap-servers -i inventory/multinode
#   ./deploy.sh bootstrap-servers --tags bootstrap

- name: Install base dependencies on all managed hosts
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords (deploy/passwords.yml, skip if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

  roles:
    # system-init is single-purpose and reusable; bootstrap-servers keeps its original full behaviour.
    # The role-level bootstrap tag preserves `./deploy.sh bootstrap-servers --tags bootstrap`.
    - role: system-init
      tags: [bootstrap, system-init]
      when: system_init.enabled | bool
    - role: bootstrap
      tags: [bootstrap]
      when: bootstrap.enabled | bool

  post_tasks:
    - name: Summarize bootstrap
      ansible.builtin.debug:
        msg:
          - "Kernel settings applied: {{ bootstrap.enforce_kernel | bool }}"
          - "Next step: ./deploy.sh prechecks -i <inventory>"
      tags: [always]
