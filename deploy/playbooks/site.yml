---
# winter · single ansible entry point (ADR-43).
#
# Thin orchestration only: every play is `hosts + roles`. ALL task logic lives in
# roles/<name>/tasks/*.yml; each role's main.yml dispatches on winter_ops_action, and
# multi-host operations attach per-host slices via `include_role tasks_from: <slice>`.
#
# Play-level keywords that roles cannot express (vars_files, serial, when) stay here.
# Any failure stops the run (any_errors_fatal) — partial convergence is not a valid state.
#
# Usage (deploy.sh wraps these):
#   ./deploy.sh deploy    -i inventory/multinode -t local-repo
#   ./deploy.sh prechecks -i inventory/pgha -t postgresql
#   ./deploy.sh deploy    -i inventory/operations/scale-out-pg -t pg-scale-out \
#       -e @group_vars/operations/pg-scale-out.yml

- name: Global pre-deployment checks
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [prechecks]
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]
  roles:
    - role: prechecks
      when: winter_ops_action | default('deploy') == 'precheck'
      tags: [prechecks]

