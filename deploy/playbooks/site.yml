---
# winter · single ansible entry point (ADR-42).
#
# All deployment work enters through this one file. It has two kinds of plays:
#   1. Component plays — one per component role. The role's tasks/main.yml dispatches on
#      `winter_ops_action` (deploy | prechecks | destroy | verify | reconfigure | upgrade) to the
#      matching task file. Tags/inventory groups select which components run.
#   2. Transactional orchestrations — imported playbooks (pg-ha, pg-scale-*, pg-migrate, app-ha,
#      observability-scale-*). These span multiple host groups with ordered, stateful steps and
#      cannot be expressed as a single role; they stay as playbooks but are no longer direct CLI
#      entry points (deploy.sh always invokes site.yml).
#
# Any failure stops the run (any_errors_fatal) — partial convergence is not a valid state.
#
# Usage (deploy.sh wraps these):
#   ./deploy.sh deploy    -i inventory/multinode                        # converge all components
#   ./deploy.sh deploy    -i inventory/multinode -t local-repo          # one component
#   ./deploy.sh prechecks -i inventory/pgha                             # all component prechecks
#   ./deploy.sh deploy    -i inventory/operations/scale-out-pg -t pg-scale-out  # operate

- name: Global pre-deployment checks
  hosts: all
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [prechecks]
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]
  roles:
    - role: prechecks
      when: winter_ops_action | default('deploy') == 'precheck'
      tags: [prechecks]

