- name: Operate HA - PostgreSQL
  hosts: management
  become: true
  gather_facts: true
  any_errors_fatal: true
  tags: [postgresql-ha]
  vars_files:
    - ../group_vars/all.yml
    # Patroni defaults carry lazy Jinja (app_db: postgresql.db_name); expose all PG-cluster
    # defaults at play scope so role `when:` conditions resolve before include_role loads them.
    - ../roles/etcd/defaults/main.yml
    - ../roles/postgresql/defaults/main.yml
    - ../roles/patroni/defaults/main.yml
    - ../roles/haproxy/defaults/main.yml
  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]
  tasks:
    - name: Apply postgresql role (ha slice)
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: ha
      tags: [postgresql-ha]

