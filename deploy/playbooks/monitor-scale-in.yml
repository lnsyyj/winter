---
# Scale in the monitoring stack (ADR-18 / ADR-33).
#
# Nodes listed in monitoring_scale.removed_nodes remain in the [monitor] inventory group but are
# excluded from every cross-node reference. At least one monitor node must remain. Monitoring data
# is preserved by default; purging is opt-in with an explicit non-empty data_dirs list.
#
# Usage:
#   ./deploy.sh monitor-scale-in -i inventory/multinode -e '{"monitoring_scale":{"removed_nodes":["mon03"]}}'

- name: Register monitoring scale-in targets
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Validate monitoring scale-in plan
      ansible.builtin.assert:
        that:
          - monitoring_scale.removed_nodes | length > 0
          - monitoring_scale.removed_nodes | unique | length == monitoring_scale.removed_nodes | length
          - (monitoring_scale.removed_nodes | difference(groups['monitor'])) | length == 0
          - (groups['monitor'] | length - monitoring_scale.removed_nodes | length) >= 1
          - not (monitoring_scale.purge_data | bool) or (monitoring_scale.data_dirs | default([]) | length > 0)
        fail_msg: "Scale-in targets must be unique [monitor] members, at least one node must remain, and purge_data=true requires a non-empty data_dirs list"
        quiet: true

    - name: Register removed nodes for the teardown play
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: monitoring_scale_targets
      loop: "{{ monitoring_scale.removed_nodes }}"
      loop_control:
        label: "{{ item }}"

- name: Rewire remaining monitor nodes and drop removed peers
  hosts: monitor
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords (required by Grafana)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Restore localhost binding when a single monitor node remains
      ansible.builtin.set_fact:
        monitoring_bind_addr: >-
          {{ '0.0.0.0' if ((groups['monitor'] | length - monitoring_scale.removed_nodes | default([]) | length) > 1)
             else monitoring_listen_addr }}
        monitoring_advertise_addr: >-
          {{ (ansible_host | default(monitoring_listen_addr)) if ((groups['monitor'] | length - monitoring_scale.removed_nodes | default([]) | length) > 1)
             else monitoring_listen_addr }}
      tags: [always]

    - name: Compute remaining monitor peer addresses
      ansible.builtin.set_fact:
        monitor_peers: >-
          {{ groups['monitor'] | difference(monitoring_scale.removed_nodes | default([]))
             | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
      tags: [always]

    - name: Recompute metrics query endpoint
      ansible.builtin.set_fact:
        monitoring_metrics_url: >-
          {{ monitoring_scale.metrics_query_url if (monitoring_scale.metrics_query_url | default('') | length > 0)
             else (hostvars[(groups['monitor'] | difference(monitoring_scale.removed_nodes | default([])) | first)]['ansible_host']
                   | default(monitoring_listen_addr)) }}
      tags: [always]

    - name: Compute the Server endpoint used by the Alertmanager webhook
      ansible.builtin.set_fact:
        monitoring_server_url: >-
          {{ hostvars[groups['management'] | first]['ansible_host'] | default(monitoring_listen_addr) }}
      tags: [always]

    - name: Point vmalert only at remaining Alertmanager replicas
      ansible.builtin.set_fact:
        monitoring_vmalert_notifiers: >-
          {{ groups['monitor'] | difference(monitoring_scale.removed_nodes | default([]))
             | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
      tags: [always]

  roles:
    - role: observability
      when: inventory_hostname not in (monitoring_scale.removed_nodes | default([]))
      tags: [observability, monitoring]

- name: Remove monitoring components from scaled-in nodes
  hosts: monitoring_scale_targets
  become: true
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Run the observability teardown
      ansible.builtin.include_tasks: ../roles/observability/tasks/remove.yml
      tags: [observability]

- name: Drop removed Grafana replicas from the Nginx upstream
  hosts: management
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Compute remaining Grafana upstream addresses
      ansible.builtin.set_fact:
        monitor_grafana_upstreams: >-
          {{ groups['monitor'] | difference(monitoring_scale.removed_nodes | default([]))
             | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
      tags: [always]

  roles:
    - role: nginx
      tags: [nginx, web]

  post_tasks:
    - name: Print monitoring scale-in summary
      ansible.builtin.debug:
        msg:
          - "Removed nodes: {{ monitoring_scale.removed_nodes | join(', ') }}"
          - "Remaining Grafana replicas: {{ monitor_grafana_upstreams | join(', ') }}"
          - "Monitoring data preserved unless monitoring_scale.purge_data=true"
      tags: [always]
