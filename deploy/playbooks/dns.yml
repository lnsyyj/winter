---
# dns · Standalone BIND 9 stage (ADR-16 / ADR-17).
# Publishes one A record per active-active Director VIP for the platform domain.
# Read-only prechecks run before convergence; use --tags precheck.dns to run only the checks.
#
# Usage:
#   ./deploy.sh dns -i inventory/multinode
#   ./deploy.sh dns -i inventory/multinode --tags precheck.dns

- name: Deploy BIND 9 DNS
  hosts: dns_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Run DNS prechecks
      ansible.builtin.include_role:
        name: dns
        tasks_from: prechecks
      tags: [precheck, precheck.dns]

  roles:
    - role: dns
      when: dns.enabled | bool
      tags: [dns]

  post_tasks:
    - name: Summarize DNS deployment
      ansible.builtin.debug:
        msg:
          - "Zone: {{ dns.domain }}"
          - "VIP A records: {{ dns_vips | default([]) | join(', ') }}"
          - "Master/slave roles come from [dns_masters] / [dns_slaves] in the inventory"
      tags: [always]
