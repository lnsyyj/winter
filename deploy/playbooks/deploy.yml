---
# deploy · Converge management plane components to the target state (ADR-17 stage semantics)
#
# Currently covered: internal repo → PostgreSQL → Nginx access layer → observability stack → Server
# Not covered: Harbor (image registry), Agent (pre-installed by ansible during the provisioning phase, zero SSH at runtime)
#              — roles will be appended in dependency order later; this play's order is the startup order
#
# Usage:
#   ./deploy.sh deploy                              # full converge
#   ./deploy.sh deploy -i inventory/multinode
#   ./deploy.sh deploy --tags observability,server  # run only the observability stack and Server (includes the internal repo)
#   ./deploy.sh deploy --list-tasks                 # see what would be done

- name: Converge management plane components (database + access layer + observability + Server)
  hosts: management
  become: true
  gather_facts: true

  # Ansible loads group_vars only from beside the "playbook directory" and the "inventory directory",
  # while this project puts the single configuration entry point in deploy/group_vars/. Declare it explicitly to avoid silently not loading it.
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords (deploy/passwords.yml, skip if absent)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Confirm this is a supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "RedHat"
        fail_msg: "Only RHEL family distributions are supported (CentOS Stream 9 / RHEL 9); actual: {{ ansible_facts.distribution }}"
        quiet: true
      tags: [always]

  roles:
    # Order equals dependency: first the internal repo (other roles pull packages from it), then the database, then the access layer,
    # and finally the monitoring stack and Server. local_repo carries multiple tags, so any subset still syncs the artifacts first.
    - role: local_repo
      tags: [repo, observability, server]
    - role: postgresql
      tags: [postgresql, db]
    - role: nginx
      when: inventory_hostname in groups['nginx']
      tags: [nginx, web]
    - role: observability
      tags: [observability, monitoring]
      when: observability.enabled | bool
    - role: winter-server
      tags: [server]
      when: winter_server.enabled | bool

  post_tasks:
    - name: Summarize results
      ansible.builtin.debug:
        msg:
          - "PostgreSQL: database {{ postgresql.db_name }} / role {{ postgresql.db_user }}"
          - "Nginx: https://{{ nginx.server_name }}:{{ nginx.https_port }} → {{ nginx.doc_root }}"
          - "API: https://{{ nginx.server_name }}/api/v1/ → {{ nginx.api_upstream }}"
          - "Grafana: https://{{ nginx.server_name }}/grafana/ (via reverse proxy, direct port 3000 access forbidden)"
          - "Observability: VM / vmalert / VictoriaLogs / Alertmanager listen only on {{ monitoring_listen_addr }}"
      tags: [always]
