---
# Scale out the monitoring stack (ADR-18 / ADR-33).
#
# Scope: stateless and HA layers only. Alertmanager forms a gossip cluster, every vmalert instance
# notifies all Alertmanager replicas, Grafana is load-balanced by Nginx, and all monitor nodes
# re-converge so cross-node references stay consistent (the second run is idempotent).
# VictoriaMetrics / VictoriaLogs keep their single-node local storage; set
# monitoring_scale.metrics_query_url to a central endpoint if replicas must aggregate.
#
# Targets must already be declared in the [monitor] inventory group.
# Usage:
#   ./deploy.sh observability-scale-out -i inventory/multinode -e '{"monitoring_scale":{"nodes":["mon02"]}}'

- name: Scale out monitoring components and rewire cross-node references
  hosts: monitor
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords (required by Grafana)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Confirm this is a supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "RedHat"
        fail_msg: "Only RHEL family distributions are supported; actual: {{ ansible_facts.distribution }}"
        quiet: true
      tags: [always]

    - name: Validate monitoring scale-out plan
      ansible.builtin.assert:
        that:
          - monitoring_scale.nodes | length > 0
          - monitoring_scale.nodes | unique | length == monitoring_scale.nodes | length
          - (monitoring_scale.nodes | difference(groups['monitor'])) | length == 0
          - groups['monitor'] | length >= 2
        fail_msg: "monitoring_scale.nodes must be non-empty, unique, already listed in [monitor]; scale-out needs at least two monitor nodes"
        quiet: true
      run_once: true
      tags: [always]

    - name: Bind monitoring components to the internal network on multi-node setups
      ansible.builtin.set_fact:
        monitoring_bind_addr: "0.0.0.0"
        monitoring_advertise_addr: "{{ ansible_host | default(monitoring_listen_addr) }}"
      tags: [always]

    - name: Compute active monitor peer addresses
      ansible.builtin.set_fact:
        monitor_peers: >-
          {{ groups['monitor'] | difference(monitoring_scale.removed_nodes | default([]))
             | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
      tags: [always]

    - name: Compute the metrics query endpoint used by Grafana and vmalert
      ansible.builtin.set_fact:
        monitoring_metrics_url: >-
          {{ monitoring_scale.metrics_query_url if (monitoring_scale.metrics_query_url | default('') | length > 0)
             else (hostvars[(groups['monitor'] | difference(monitoring_scale.removed_nodes | default([])) | first)]['ansible_host']
                   | default(monitoring_listen_addr)) }}
      tags: [always]

    - name: Compute the Server endpoint used by the Alertmanager webhook
      ansible.builtin.set_fact:
        monitoring_server_url: >-
          {{ hostvars[groups['management'] | first]['ansible_host'] | default(monitoring_listen_addr) }}
      tags: [always]

    - name: Point vmalert at every Alertmanager replica
      ansible.builtin.set_fact:
        monitoring_vmalert_notifiers: >-
          {{ groups['monitor'] | difference(monitoring_scale.removed_nodes | default([]))
             | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
      tags: [always]

  roles:
    - role: observability
      tags: [observability, monitoring]

  post_tasks:
    - name: Print monitoring scale-out summary
      ansible.builtin.debug:
        msg:
          - "Monitor nodes: {{ groups['monitor'] | join(', ') }}"
          - "Alertmanager gossip peers: {{ monitor_peers | join(', ') }}"
          - "Metrics query endpoint: {{ monitoring_metrics_url }}"
          - "Grafana and vmalert are stateless and can be added incrementally"
          - "VictoriaMetrics / VictoriaLogs remain single-node local storage; configure monitoring_scale.metrics_query_url for aggregation"
      tags: [always]

- name: Update the Nginx Grafana upstream with all monitor nodes
  hosts: management
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Compute Grafana upstream addresses
      ansible.builtin.set_fact:
        monitor_grafana_upstreams: >-
          {{ groups['monitor'] | difference(monitoring_scale.removed_nodes | default([]))
             | map('extract', hostvars, 'ansible_host') | select('defined') | list }}
      tags: [always]

  roles:
    - role: nginx
      tags: [nginx, web]

  post_tasks:
    - name: Print access summary
      ansible.builtin.debug:
        msg:
          - "Grafana is reachable at https://{{ nginx.server_name }}/grafana/ via {{ monitor_grafana_upstreams | length }} replica(s)"
      tags: [always]
