---
# High availability convergence (ADR-16 / ADR-35): stateless Server replicas and Harbor replicas
# sit behind Nginx; Keepalived provides a floating VIP on the [lb] nodes. With ha.lvs.enabled=true
# the [lb] nodes are LVS Directors and [nginx_nodes] are real servers, so the VIP dispatches across
# every Nginx replica instead of pinning all traffic to the node currently holding it.
#
# Prerequisites are asserted, never silently assumed:
# - [lb], [server_nodes], [harbor_nodes], [nginx_nodes] groups exist in the inventory
# - ha.vip and vault_keepalived_auth_pass are set when ha.enabled=true
# - server_ha.database_host points at the PG HA access point when servers span multiple nodes
# - Harbor has external PostgreSQL / Redis / NFS, Docker, and its offline installer in the repo
#
# Usage:
#   ./deploy.sh ha-setup -i inventory/multinode

- name: Deploy stateless Server replicas
  hosts: server_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Confirm this is a supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "RedHat"
        fail_msg: "Only RHEL family distributions are supported; actual: {{ ansible_facts.distribution }}"
        quiet: true
      tags: [always]

    - name: Reject localhost database address for multi-replica Server
      ansible.builtin.assert:
        that: (groups['server_nodes'] | length) == 1 or server_ha.database_host != '127.0.0.1'
        fail_msg: "Server replicas require server_ha.database_host pointing at the PG HA access point (HAProxy/VIP), not 127.0.0.1"
        quiet: true
      tags: [always]

    - name: Bind this Server replica to its internal address
      ansible.builtin.set_fact:
        winter_server: "{{ winter_server | combine({'listen_addr': ansible_host | default(winter_server.listen_addr)}) }}"
      tags: [always]

  roles:
    - role: winter-server
      tags: [server]

- name: Deploy Harbor replicas
  hosts: harbor_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Bind this Harbor replica to its internal address
      ansible.builtin.set_fact:
        harbor: "{{ harbor | combine({'bind_addr': ansible_host | default(harbor.bind_addr)}) }}"
      tags: [always]

  roles:
    - role: harbor
      when: harbor.enabled | bool
      tags: [harbor]

- name: Configure the Nginx real servers behind the LVS VIP
  hosts: nginx_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Confirm this is a supported distribution
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "RedHat"
        fail_msg: "Only RHEL family distributions are supported; actual: {{ ansible_facts.distribution }}"
        quiet: true
      tags: [always]

    # The Nginx template selects `upstream winter_api` only when server_upstreams is set.
    # Compute it here (before the nginx role runs) so the reverse proxy targets the Server
    # replicas instead of falling back to 127.0.0.1:8081, which is wrong in HA mode where
    # each Server replica binds to its own internal address.
    - name: Compute Server and Harbor upstream addresses for the Nginx site
      ansible.builtin.set_fact:
        server_upstreams: "{{ groups['server_nodes'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
        harbor_upstreams: "{{ groups['harbor_nodes'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
      tags: [always]

  roles:
    - role: realserver
      when: ha.lvs.enabled | bool
      tags: [ha, lvs, realserver]
    - role: nginx
      tags: [nginx, web]

- name: Configure the Keepalived Director with LVS load balancing
  hosts: lb
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Reject overlapping Director and real server roles
      ansible.builtin.assert:
        that: (not (ha.lvs.enabled | bool)) or (groups['lb'] | intersect(groups['nginx_nodes']) | length == 0)
        fail_msg: "LVS/DR requires [lb] and [nginx_nodes] to be disjoint; otherwise the Director and a real server share the same VIP"
        quiet: true
      tags: [always]

    - name: Compute replica addresses for upstreams, LVS backends and VRRP peers
      ansible.builtin.set_fact:
        server_upstreams: "{{ groups['server_nodes'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
        harbor_upstreams: "{{ groups['harbor_nodes'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
        nginx_lvs_backends: "{{ groups['nginx_nodes'] | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
        ha_peer_addresses: "{{ groups['lb'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | select('defined') | list }}"
      tags: [always]

    - name: Inject LVS real servers into the Keepalived configuration
      ansible.builtin.set_fact:
        ha: "{{ ha | combine({'lvs': ha.lvs | combine({'real_servers': nginx_lvs_backends})}) }}"
      tags: [always]

  roles:
    - role: keepalived
      when: ha.enabled | bool
      tags: [ha, keepalived]

  post_tasks:
    - name: Print HA summary
      ansible.builtin.debug:
        msg:
          - "Server upstream: {{ server_upstreams | join(', ') }}"
          - "Harbor upstream: {{ harbor_upstreams | default([]) | join(', ') }}"
          - "LVS/DR backends: {{ nginx_lvs_backends | default([]) | join(', ') }}"
          - "Keepalived VIPs: {{ ((ha.vips | default([]) | length > 0) | ternary(ha.vips, [ha.vip])) | join(', ') }} on {{ ha.interface }}"
      tags: [always]
