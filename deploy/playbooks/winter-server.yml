---
# server · Standalone management API stage (ADR-17 / ADR-34).
# Deploys the stateless Go binary as a systemd service; sessions and tokens live in PostgreSQL.
# Read-only prechecks run before convergence; use --tags precheck.server to run only the checks.
#
# Usage:
#   ./deploy.sh winter-server -i inventory/multinode
#   ./deploy.sh winter-server -i inventory/multinode --tags precheck.server

- name: Deploy the management Server
  hosts: server_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Run Server prechecks
      ansible.builtin.include_role:
        name: winter-server
        tasks_from: prechecks
      tags: [precheck, precheck.server]

    - name: Bind this Server replica to its internal address
      ansible.builtin.set_fact:
        winter_server: "{{ winter_server | combine({'listen_addr': ansible_host | default(winter_server.listen_addr)}) }}"
      tags: [always]

  roles:
    - role: winter-server
      when: winter_server.enabled | bool
      tags: [server]

  post_tasks:
    - name: Summarize Server deployment
      ansible.builtin.debug:
        msg: "Server: {{ winter_server.listen_addr }}:{{ winter_server.port }} -> database {{ server_ha.database_host }}"
      tags: [always]
