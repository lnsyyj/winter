---
# pg-scale-out · add replica nodes to the PostgreSQL HA cluster (etcd + Patroni + HAProxy)
#
# Nodes must already be present in [management] in the inventory (ADR-17: topology is expressed by
# inventory groups), so the final etcd member count is the size of [management]. Add nodes in a
# quantity that keeps that final count odd: 1 -> 3 (from an opted-in single-node HA bootstrap),
# 3 -> 5, and so on. At least one existing member must remain to run etcdctl member add.
#
# etcd membership is changed SEQUENTIALLY, one node at a time. Two regimes:
#   * >= 3 existing members: a voting member can be added and started safely (quorum stays >= 3).
#   * exactly 1 existing member: adding a voting member would drop quorum (1 -> 2 needs both up),
#     so the new node joins as a non-voting learner, starts, then is promoted before the next one.
#   * exactly 2 existing members: rejected — an even-sized cluster is not a supported steady state.
#
# Usage:
#   ./deploy.sh pg-scale-out -i inventory/pgha -e '{"pg_scale":{"nodes":["pg-d","pg-e"]}}'

- name: Scale out the PostgreSQL HA cluster
  hosts: management
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml
    # include_role only loads a role's defaults on hosts where it runs, and too late for tasks
    # that reference those vars. Expose every PG-cluster role default at play scope so the
    # member add / promote / HAProxy tasks can resolve etcd_role, patroni and postgresql on all hosts.
    - ../roles/etcd/defaults/main.yml
    - ../roles/postgresql/defaults/main.yml
    - ../roles/patroni/defaults/main.yml
    - ../roles/haproxy/defaults/main.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [pg-scale-out]

    # Scale targets are already members of [management], so the final etcd member count is
    # groups['management'] | length — NOT management + nodes (the old expression double-counted).
    - name: Validate scale-out plan
      ansible.builtin.assert:
        that:
          - pg_scale.nodes | length > 0
          - pg_scale.nodes | unique | length == pg_scale.nodes | length
          - pg_scale.nodes | difference(groups['management']) | length == 0
          - (groups['management'] | length) % 2 == 1
          - (groups['management'] | difference(pg_scale.nodes) | length) >= 1
          - (groups['management'] | difference(pg_scale.nodes) | length) != 2
        fail_msg: >-
          pg_scale.nodes must be unique hosts already in [management], at least one existing member
          must remain, the existing member count must be odd (1 or >=3), and the final count odd.
        quiet: true
      run_once: true
      tags: [pg-scale-out]

    - name: Record existing and expected member counts
      ansible.builtin.set_fact:
        pg_existing_members: "{{ groups['management'] | difference(pg_scale.nodes) | length }}"
        pg_expected_members: "{{ groups['management'] | length }}"
        pg_existing_endpoint: "{{ hostvars[groups['management'] | difference(pg_scale.nodes) | first]['ansible_host'] }}"
        # Learner mode is required only when bootstrapping from a single-member cluster.
        pg_use_learner: "{{ (groups['management'] | difference(pg_scale.nodes) | length) == 1 }}"
      tags: [pg-scale-out]

  tasks:
    # Add one etcd member at a time, start it, and (in learner mode) promote it before moving on.
    # Serial is enforced by the loop with run_once; each iteration fully converges one node.
    - name: Add and converge each new cluster member sequentially
      ansible.builtin.include_tasks: scale-out-member.yml
      loop: "{{ pg_scale.nodes }}"
      loop_control:
        loop_var: pg_join_node
        index_var: pg_join_index
        label: "{{ pg_join_node }}"
      tags: [pg-scale-out]

    # HAProxy backends reference all [management] members; converge it once after all joined.
    - name: Configure the HAProxy entry point for the grown cluster
      ansible.builtin.include_role:
        name: haproxy
      tags: [pg-scale-out]

  post_tasks:
    - name: Verify the new nodes are streaming replicas
      ansible.builtin.uri:
        url: "http://{{ hostvars[item]['ansible_host'] }}:{{ pg_cluster.rest_port }}/replica"
        status_code: 200
      loop: "{{ pg_scale.nodes }}"
      delegate_to: "{{ groups['management'] | difference(pg_scale.nodes) | first }}"
      tags: [pg-scale-out]

    - name: Report scale-out result
      ansible.builtin.debug:
        msg:
          - "Added {{ pg_scale.nodes | join(', ') }}; etcd members: {{ pg_expected_members }}"
          - "Learner mode used: {{ pg_use_learner }} (single-member bootstrap path)"
      run_once: true
      tags: [pg-scale-out]
