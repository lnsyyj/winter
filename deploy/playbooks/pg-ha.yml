---
# PostgreSQL high availability cluster: etcd (leader election) + Patroni (orchestration) + HAProxy (single entry point)
#
# Usage:
#   ./deploy.sh pg-ha -i inventory/pgha                 # full deployment
#   ./deploy.sh pg-ha -i inventory/pgha --tags etcd     # DCS only
#   ./deploy.sh pg-ha -i inventory/pgha --tags patroni  # PG cluster only
#   ./deploy.sh pg-ha -i inventory/pgha --tags haproxy  # entry point only
#
# All ports come from pg_cluster in group_vars (PG 5433 / REST 8008 / etcd 2379,2380 / entry point 5434)

- name: PostgreSQL high availability cluster
  hosts: management
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load deployment passwords
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../passwords.yml"
      failed_when: false
      no_log: true
      tags: [pg-ha]

    # A single-member etcd + single Patroni is a valid bootstrap state for the 1 -> 3 growth path,
    # but has no fault tolerance. Require an explicit opt-in so production never deploys it by
    # accident; the normal floor remains 3 nodes and an odd count.
    - name: Cluster membership must be odd (etcd requires a quorum)
      ansible.builtin.assert:
        that:
          - groups['management'] | length % 2 == 1
          - (groups['management'] | length >= 3) or
            (pg_cluster.allow_single_node_bootstrap | default(false) | bool and groups['management'] | length == 1)
        fail_msg: >-
          etcd requires an odd count and at least 3 nodes; currently {{ groups['management'] | length }}.
          To bootstrap a single-node HA cluster for a later 1 -> 3 growth, set
          pg_cluster.allow_single_node_bootstrap=true explicitly (no fault tolerance in that state).
        quiet: true
      run_once: true
      tags: [pg-ha]

  roles:
    # Order: binaries first → then leader election → then Patroni brings up PG → finally the unified entry point
    - role: postgresql
      tags: [pg-ha]
    - role: etcd
      tags: [pg-ha]
    - role: patroni
      tags: [pg-ha]
    - role: haproxy
      tags: [pg-ha]
