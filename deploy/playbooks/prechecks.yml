---
# Pre-deployment checks (ADR-17): read-only, do not modify the system.
# Corresponds to stage C3 of the installation and deployment manual and test case TC-26.
- name: Pre-deployment checks (read-only)
  hosts: all
  gather_facts: true
  become: true
  # Same as deploy.yml: group_vars is under deploy/, not beside the playbook directory, so declare it explicitly
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: prechecks
      tags: [prechecks]
